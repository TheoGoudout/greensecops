[project]
name = "app"
version = "0.11.2"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>2.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.0,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.66.1,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "celery[redis]>=5.6.3,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "pyyaml>=6.0,<7.0",
    "ruamel-yaml>=0.19.1,<0.20",
    "pygithub",
    "cryptography>=42.0.0,<44.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.3.0,<0.4.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-ollama>=0.2.0,<0.3.0",
    "langsmith>=0.2.0,<0.3.0",
    "stripe>=10.0.0,<11.0.0",
    "python-statemachine>=2.3,<3.0",
    "boto3>=1.34,<2.0",
    "python-hcl2>=6.1,<7.0",
    "slowapi>=0.1.9,<0.2.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
    "pre-commit>=4.0.0,<5.0.0",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

# Celery's @task decorator is untyped; strict mode would otherwise flag every
# task definition in the worker modules.
[[tool.mypy.overrides]]
module = "app.workers.tasks.*"
disable_error_code = ["untyped-decorator"]

# sqlmodel's Field() stub overloads don't accept default_factory/sa_type
# combinations that are valid at runtime.
[[tool.mypy.overrides]]
module = "app.models.db.*"
disable_error_code = ["call-overload"]

# boto3/botocore ship no py.typed marker or bundled stubs (unlike PyGithub).
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# python-hcl2 ships py.typed but re-exports loads/load/etc from .api without
# `as`-syntax, so strict mode's implicit-reexport check doesn't see them as
# public despite being genuinely part of the package's documented API.
[[tool.mypy.overrides]]
module = "hcl2"
implicit_reexport = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]
# SQLModel needs quoted, bracket-wrapped forward refs (Optional["X"], list["X"])
# for cross-module Relationship() targets — a real typing.ForwardRef it can
# introspect structurally without importing the target class. UP037/UP045
# "helpfully" collapse those into a bare `X | None` union string that
# SQLAlchemy's registry resolver cannot parse, breaking mapper configuration.
"app/models/db/**" = ["UP037", "UP045"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"
omit = [
    "app/initial_data.py",
    "app/backend_pre_start.py",
    "app/tests_pre_start.py",
    "app/services/llm/*",
    "app/services/github/app_client.py",
    "app/services/github/fix_delivery.py",
    "app/workers/tasks/fix_generation.py",
    "app/workers/tasks/fix_delivery.py",
    "app/services/opa/evaluator.py",
]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.uv.sources]
pygithub = { git = "https://github.com/TheoGoudout/PyGithub", rev = "332b0617" }

[tool.ty.terminal]
error-on-warning = true
