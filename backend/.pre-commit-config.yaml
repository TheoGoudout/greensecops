default_stages: [pre-commit]

repos:
  # Python: ruff lint + format (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^app/
      - id: ruff-format
        files: ^app/

  # mypy lives in the repository-root .pre-commit-config.yaml now. It was here,
  # at the pre-push stage, where CI's `prek run` never reached it.

  # OPA: format and validate rego policies (via Docker)
  - repo: local
    hooks:
      - id: opa-fmt
        name: OPA policy format
        entry: bash -c 'docker run --rm -u "$(id -u):$(id -g)" -v "$(pwd)/app/rules:/policies" openpolicyagent/opa:1.19.0-static fmt --write /policies'
        language: system
        files: ^app/rules/.*\.rego$
        pass_filenames: false

      - id: opa-check
        name: OPA policy check
        entry: bash -c 'docker run --rm -v "$(pwd)/app/rules:/policies:ro" openpolicyagent/opa:1.19.0-static check /policies'
        language: system
        files: ^app/rules/.*\.rego$
        pass_filenames: false
