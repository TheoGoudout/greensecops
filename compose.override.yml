services:

  db:
    restart: "no"
    # Bind to localhost only — never expose the database on all interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}

  adminer:
    image: adminer
    restart: always
    # Unauthenticated DB admin UI — localhost only.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  redis:
    restart: "no"
    # Holds live GitHub installation tokens — localhost only.
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    environment: &backend-required-env
      FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
      GREENSECOPS_PUBLIC_URL: ${GREENSECOPS_PUBLIC_URL:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS?Variable not set}
      SECRET_KEY: ${SECRET_KEY?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov

  prestart:
    environment: *backend-required-env
    develop:
      watch:
        - path: ./backend/app/alembic
          action: sync+restart
          target: /app/backend/app/alembic
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./pyproject.toml
          action: rebuild

  celery-worker:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=debug --concurrency=2 -Q default,analysis,fixes
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    environment: *backend-required-env

  celery-beat:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-required-env

  flower:
    image: mher/flower:2.0.1
    restart: always
    # Unauthenticated Celery dashboard — localhost only.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555

  opa:
    restart: "no"
    ports:
      - "8181:8181"
    develop:
      watch:
        - path: ./backend/app/rules
          action: rebuild
        - path: ./opa/Dockerfile
          action: rebuild

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/5173' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 120s
      timeout: 5s
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev-stage
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GREENSECOPS_PUBLIC_URL=${GREENSECOPS_PUBLIC_URL:-}
      - VITE_GITHUB_APP_NAME=${GITHUB_APP_NAME}
      - VITE_GITHUB_OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}
    develop:
      watch:
        - path: ./frontend/src
          action: sync
          target: /app/frontend/src
        - path: ./frontend/public
          action: sync
          target: /app/frontend/public
        - path: ./frontend/package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  landing:
    restart: "no"
    ports:
      - "3001:80"
    environment:
      APP_URL: ${FRONTEND_HOST:-http://localhost:5173}
      MARKETING_URL: ${MARKETING_URL:-https://greensecops.com}
      DOCS_URL: ${DOCS_URL:-http://localhost:3002}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@greensecops.com}
      SALES_EMAIL: ${SALES_EMAIL:-sales@greensecops.com}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-legal@greensecops.com}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-privacy@greensecops.com}
    develop:
      watch:
        - path: ./landing/assets
          action: sync
          target: /usr/share/nginx/html/assets
        - path: ./landing/entrypoint.sh
          action: sync
          target: /docker-entrypoint-landing.sh
        - path: ./landing/Dockerfile
          action: rebuild

  docs:
    restart: "no"
    ports:
      - "3002:80"
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        - DOCS_BASE_URL=${DOCS_URL:-http://localhost:3002}
    develop:
      watch:
        - path: ./docs
          action: rebuild
        - path: ./backend/app/rules
          action: rebuild

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
