services:

  db:
    restart: "no"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  redis:
    restart: "no"
    ports:
      - "6379:6379"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    environment: &backend-required-env
      FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS?Variable not set}
      SECRET_KEY: ${SECRET_KEY?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov

  prestart:
    environment: *backend-required-env
    develop:
      watch:
        - path: ./backend/app/alembic
          action: sync+restart
          target: /app/backend/app/alembic
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./pyproject.toml
          action: rebuild

  celery-worker:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=debug --concurrency=2 -Q default,analysis,fixes
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    environment: *backend-required-env

  celery-beat:
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-required-env

  flower:
    restart: "no"
    ports:
      - "5555:5555"

  opa:
    restart: "no"
    ports:
      - "8181:8181"

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 24
      start_period: 180s
      timeout: 5s
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev-stage
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GITHUB_OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}
      - VITE_GITHUB_APP_NAME=${GITHUB_APP_NAME}
    develop:
      watch:
        - path: ./frontend/src
          action: sync
          target: /app/frontend/src
        - path: ./frontend/public
          action: sync
          target: /app/frontend/public
        - path: ./frontend/package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  landing:
    restart: "no"
    ports:
      - "3001:80"
    build:
      context: .
      dockerfile: landing/Dockerfile
    environment:
      APP_URL: ${FRONTEND_HOST:-http://localhost:5173}

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
