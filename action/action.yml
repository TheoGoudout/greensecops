name: GreenSecOps Telemetry
description: Collects CI/CD pipeline telemetry and sends it to GreenSecOps for analysis
author: GreenSecOps

# Authentication: this action uses GitHub OIDC — no API token needed.
# Your workflow must declare:
#   permissions:
#     id-token: write

inputs:
  greensecops_url:
    description: GreenSecOps instance URL (e.g. https://app.greensecops.com)
    required: true
  docker_build_metadata:
    description: >-
      Path to a `docker buildx build --metadata-file` JSON. Optional. Without
      it, image sizes and layers are still collected automatically, but
      cache-hit data — the most useful Docker metric — is unavailable, because
      `docker history` cannot tell whether a layer was cached.
    required: false
    default: ""
  dockerfile_path:
    description: >-
      Repository-relative path of the Dockerfile this workflow builds, e.g.
      `backend/Dockerfile`. Optional, but it is the join back to the static
      engine: without it a measured finding cannot be attributed to a file, so
      no fix can be generated from it.
    required: false
    default: ""
  sample_interval:
    description: Seconds between background telemetry samples
    required: false
    default: "30"

runs:
  using: node20
  pre: dist/pre/index.js
  pre-if: always()
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: always()
