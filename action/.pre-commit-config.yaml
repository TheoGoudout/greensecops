default_stages: [pre-commit]

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # TypeScript: biome lint + format + type check
  - repo: local
    hooks:
      - id: biome-check-action
        name: Biome lint & format (action)
        entry: bunx biome check --write --unsafe --no-errors-on-unmatched --files-ignore-unknown=true src/
        language: system
        files: \.(ts|js|json)$
        exclude: ^src/client/
        pass_filenames: false

      - id: tsc-action
        name: TypeScript check (action)
        entry: bunx tsc --noEmit
        language: system
        files: \.ts$
        exclude: ^src/client/
        pass_filenames: false

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
