[defaults]
# No default inventory on purpose. The dynamic inventory calls AWS, so making
# it the default would mean `ansible-lint` and `--syntax-check` — neither of
# which needs a host — fail without credentials. Pass it explicitly instead:
#   ansible-playbook -i inventory/aws_ec2.yml playbooks/deploy.yml
roles_path             = roles/
collections_path       = collections/
stdout_callback        = yaml
force_handlers         = True
interpreter_python     = auto_silent
# The instances have no public address and no SSH key; SSM is the transport,
# so there is no host key to check in the first place.
host_key_checking      = False
retry_files_enabled    = False
display_skipped_hosts  = False

[inventory]
# enable_plugins replaces the built-in list rather than extending it, so the
# static plugins have to be named too — without them `-i localhost,` and any
# plain inventory file stop working, which breaks --syntax-check and the
# localhost-only build playbook.
enable_plugins = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini, toml

[ssh_connection]
pipelining = True
