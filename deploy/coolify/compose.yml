# GreenSecOps for Coolify, on one small server.
#
# The difference from the repository's compose.yml is what is *absent*:
#
#   * No frontend, landing or docs containers. Those three surfaces are static
#     and are published to Cloudflare Pages by .github/workflows/pages.yml.
#   * No separate celery-beat container. The worker runs an embedded beat,
#     which is safe because this deployment runs exactly one worker.
#   * No build sections. Images are published to GHCR by
#     .github/workflows/images.yml as multi-architecture manifests covering
#     amd64 and arm64, so neither the target server nor the Raspberry Pi
#     running Coolify compiles anything — and the same tag runs on whichever
#     Hetzner line happens to be in stock.
#
# Every image-based service carries `pull_policy: always`, because Compose's
# default is `missing`: an image already on the host is reused, and a tag that
# does not change gives Docker no reason to look for a new one. That is how this
# deployment served a stale backend against a freshly published dashboard.
#
# The real fix is upstream — CI pins TAG to an immutable `sha-<short>` per
# commit (images.yml on staging, release-deploy.yml on production), so the
# reference itself changes and the pull cannot be skipped. This is the braces to
# that belt: it covers a redeploy clicked by hand and a fork still on
# `TAG=latest`.
#
# Not, any longer, someone running this file with `docker compose`. The
# provider-catalog mount below carries two keys Coolify understands and
# Compose rejects; see the comment on it. The root compose.yml is the one to
# run by hand.
#
# Five containers instead of ten, on a box that costs about €13/month. See
# deploy/coolify/README.md.
#
# The environment list below duplicates compose.yml's. That is unavoidable —
# Coolify substitutes only the variables a compose file names, so an omitted
# one silently never reaches the container — and it is the reason to change
# both files together when a setting is added.
#
# Resource limits
#
# Every service is bounded, for the reasons compose.yml explains at length:
# nothing here bounds itself, and an unbounded Celery worker means the kernel's
# OOM killer choosing a victim by score rather than by importance. The values
# are the same, except for celery-worker, which is smaller here because this
# deployment defaults to CELERY_CONCURRENCY=2 rather than 4.
#
# It matters more on this deployment than on any other. Coolify is a
# multi-tenant platform and this is the topology people put other projects
# beside — these limits are the difference between "GreenSecOps had a busy
# scan" and "the box went down". The caps sum to about 5.5 GB and the
# reservations to about 1.5 GB, so on a CPX31's 8 GB the steady-state footprint
# leaves real room for a neighbour, and the caps stop a burst from claiming it.
#
# Anything sharing this host should be bounded the same way, and nothing
# sharing it should mount /var/run/docker.sock — that is root on the host, and
# therefore root over this stack's GitHub App key and customer credentials.

services:
  db:
    image: postgres:18
    restart: always
    mem_limit: 1g
    mem_reservation: 256m
    cpu_shares: 2048
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-greensecops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: always
    # If a backlog ever approaches this, set `maxmemory` rather than raising
    # it: a broker that evicts beats a broker the kernel kills.
    mem_limit: 512m
    mem_reservation: 64m
    cpu_shares: 2048
    volumes:
      - app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    image: ${IMAGE_REGISTRY:-ghcr.io/theogoudout}/greensecops-opa:${TAG:-latest}
    restart: always
    pull_policy: always
    # The compiled rule bundle dominates the footprint and does not grow with
    # load, which is why this is the smallest steady-state service here.
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 1024
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://localhost:8181/health\"}).status_code == 200; true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prestart:
    image: ${IMAGE_REGISTRY:-ghcr.io/theogoudout}/greensecops-backend:${TAG:-latest}
    command: bash scripts/prestart.sh
    restart: "no"
    pull_policy: always
    # Migrates and exits, so it never overlaps steady state.
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 1024
    depends_on:
      db:
        condition: service_healthy
    # The provider catalog, mounted as a file Coolify can edit rather than one
    # baked into the image. prestart, backend and celery-worker share &app-env
    # and therefore its AI_PROVIDERS_CONFIG, so the path has to resolve in all
    # three — hence the anchor here and the aliases below.
    #
    # `content` and `is_directory` are Coolify's keys, not Compose's, and this
    # is the only shape that yields an editable *file*: Coolify takes a bind
    # mount for a directory unless `content` is set, and would create one at
    # the mount point — a container finding a directory where it expects JSON.
    # Coolify strips both keys before Docker is handed the file. `docker
    # compose` rejects them outright, which is what makes this file Coolify's
    # alone to run; the root compose.yml is the one to run by hand.
    #
    # `content` seeds a resource that has no file storage for this mount yet.
    # Once one exists, Coolify reads its content back from its own database on
    # every parse, so an edit made in the Storages tab survives redeploys
    # instead of being reverted to what is written here. Keep it in step with
    # backend/app/config/ai_providers.json regardless — that is the copy the
    # image falls back to, and what a fresh resource starts from.
    # scripts/validate_coolify_compose.py checks the two agree.
    volumes:
      - &ai-providers-config
        type: bind
        source: ./ai_providers.json
        target: /etc/greensecops/ai_providers.json
        is_directory: false
        content: |
          {
            "providers": [
              {
                "id": "openai",
                "name": "OpenAI",
                "default_model": "gpt-4o-mini",
                "models": ["gpt-4o-mini", "gpt-4o", "gpt-4-turbo", "gpt-3.5-turbo"]
              },
              {
                "id": "anthropic",
                "name": "Anthropic",
                "default_model": "claude-haiku-4-5-20251001",
                "models": [
                  "claude-haiku-4-5-20251001",
                  "claude-sonnet-4-6",
                  "claude-opus-4-7"
                ]
              },
              {
                "id": "gemini",
                "name": "Google Gemini",
                "default_model": "gemini-3.1-flash-lite",
                "models": ["gemini-3.1-flash-lite"]
              },
              {
                "id": "ollama",
                "name": "Ollama (self-hosted)",
                "default_model": "llama3.2",
                "models": []
              }
            ]
          }
    environment: &app-env
      # General
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PROJECT_NAME=${PROJECT_NAME:-GreenSecOps}
      # Hosts & URLs. Only the API is a Coolify service, so only it has a
      # SERVICE_URL_* magic variable — the other three live on Cloudflare and
      # Coolify has no hostname to derive for them.
      #
      # `:?` marks those three required, which Coolify honours by sorting them
      # to the top of the Environment Variables tab with a red border when
      # empty. Without it an unset variable is substituted as the empty string
      # and the backend's env_ignore_empty takes its default — for
      # FRONTEND_HOST, `http://localhost:5173`, which is the deployment's only
      # CORS origin and the host of the OAuth callback. That is not a
      # hypothetical: it is why staging answered every request while the
      # browser discarded every answer.
      #
      # CI writes all three from deploy/cloudflare/env/<environment>.env — see
      # .github/scripts/shared/coolify-env-sync.sh — so on this deployment they are filled in
      # rather than typed. The marking is for a fork, a resource CI has not
      # reached yet, and anyone running this file by hand.
      - FRONTEND_HOST=${FRONTEND_HOST:?}
      - BACKEND_HOST=${SERVICE_URL_BACKEND}
      - GREENSECOPS_PUBLIC_URL=${GREENSECOPS_PUBLIC_URL}
      - MARKETING_URL=${MARKETING_URL:?}
      - DOCS_URL=${DOCS_URL:?}
      - BACKEND_CORS_ORIGINS=${FRONTEND_HOST:?}
      # Auth & Security
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_FIRSTSUPERUSER}
      - EMAIL_RESET_TOKEN_EXPIRE_HOURS=${EMAIL_RESET_TOKEN_EXPIRE_HOURS:-48}
      # Database & Infrastructure
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_URL=redis://redis:6379/0
      - OPA_URL=http://opa:8181
      # AWS (cloud posture scanning) — GreenSecOps's own identity. A real IAM
      # user's keys; unset disables cloud-posture scanning only.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Email / SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@example.com}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME}
      - SMTP_TLS=${SMTP_TLS:-True}
      - SMTP_SSL=${SMTP_SSL:-False}
      - SMTP_PORT=${SMTP_PORT:-587}
      # GitHub
      - GITHUB_ACTION_REF=${GITHUB_ACTION_REF:-greensecops/telemetry@v1}
      - GITHUB_BOT_HANDLE=${GITHUB_BOT_HANDLE:-@greensecops}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${SERVICE_HEX_40_GITHUBWEBHOOKSECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_BOT_TOKEN=${GITHUB_BOT_TOKEN}
      - GITHUB_BOT_LOGIN=${GITHUB_BOT_LOGIN}
      # AI / LLM
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      # The catalog of provider ids, display names and model lists. It
      # defaults to the file bind mounted into every service that shares this
      # environment, so a model list changes in Coolify rather than in a new
      # image.
      - AI_PROVIDERS_CONFIG=${AI_PROVIDERS_CONFIG:-/etc/greensecops/ai_providers.json}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-greensecops}
      # Billing (Stripe)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_ULTIMATE=${STRIPE_PRICE_ULTIMATE}
      # Rate limiting. Coolify fronts the backend with Traefik, so the socket
      # peer is always the proxy — X-Forwarded-For is the only real client
      # address here, and the proxy overwrites any caller-supplied value.
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-300/minute}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI}
      - RATE_LIMIT_TRUST_PROXY_HEADERS=${RATE_LIMIT_TRUST_PROXY_HEADERS:-True}
      # Observability
      - SENTRY_DSN=${SENTRY_DSN}
      # Celery
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/theogoudout}/greensecops-backend:${TAG:-latest}
    restart: always
    pull_policy: always
    # The image runs `fastapi run --workers 4`; each uvicorn worker holds its
    # own copy of the application, so the floor is four of them.
    mem_limit: 1536m
    mem_reservation: 512m
    cpu_shares: 1024
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      opa:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - *ai-providers-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/theogoudout}/greensecops-backend:${TAG:-latest}
    restart: always
    pull_policy: always
    # The service most likely to hit its cap, and the reason the caps exist.
    # Prefork holds CELERY_CONCURRENCY children plus a parent, each with the
    # whole application, and a scan's working set on top — budget roughly 500m
    # per worker plus 500m of parent, and raise this if you raise concurrency.
    #
    # Lowest CPU weight here: a scan is background work and should yield to
    # anything a user is waiting on.
    mem_limit: 2g
    mem_reservation: 512m
    cpu_shares: 512
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: *app-env
    # --beat runs the periodic scheduler inside the worker rather than as its
    # own container. Only safe with exactly one worker: two embedded beats
    # would each fire every scheduled task. Scaling this service means moving
    # beat back out, as the root compose.yml has it.
    command: >-
      celery -A app.workers.celery_app worker --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      -Q default,analysis,fixes
      --beat --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - app-celery-data:/var/lib/celery
      - *ai-providers-config
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  app-db-data:
  app-redis-data:
  app-celery-data:
