default_stages: [pre-commit]

repos:
  # General file hygiene. The Terraform under backend/tests/fixtures/terraform/
  # is vendored byte-for-byte from public repos so the parser tests are anchored
  # in code nobody here wrote — normalising its whitespace would quietly make it
  # ours. See that directory's README.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^backend/tests/fixtures/terraform/.*\.tf$
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/terraform/.*\.tf$
      - id: check-yaml
        args: [--unsafe]  # allow custom tags in compose files
      - id: check-json
        exclude: |
            (?x)^(
                .vscode/launch.json|
                frontend/tsconfig.json|
                action/tsconfig.json
            )$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^backend/tests/fixtures/terraform/.*\.tf$

  # GitHub Actions static analysis. Offline only: the online audits need a
  # GitHub token and network round-trips per action, which belongs in CI rather
  # than in front of every commit. .github/workflows/zizmor.yml runs the full
  # set, so what this hook catches is the cheap half, before it reaches a
  # branch. Configuration is shared — both read .github/zizmor.yml.
  - repo: local
    hooks:
      - id: zizmor
        name: Audit GitHub Actions workflows with zizmor
        entry: uv run zizmor --no-online-audits --min-confidence=medium
        language: system
        files: ^(\.github/(workflows/.*\.ya?ml|zizmor\.yml)|action/(\.github/workflows/.*\.ya?ml|action\.yml)|.*\.pre-commit-config\.yaml)$
        pass_filenames: false
        args: ["."]

  # OpenAPI client generation
  - repo: local
    hooks:
      - id: generate-openapi-client
        name: Generate OpenAPI client
        entry: bash scripts/generate-client.sh
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

      # Regenerate the landing-page workflow snippets from examples/*.yml so the
      # marketing page always shows the canonical, rule-validated workflows.
      - id: render-landing-examples
        name: Render landing examples from examples/
        entry: python3 scripts/render_landing_examples.py
        language: system
        files: ^(examples/.*\.ya?ml|landing/(index|workflows)\.html|scripts/render_landing_examples\.py)$
        pass_filenames: false

      # Regenerate the pricing cards and comparison table from the backend's
      # plan catalog. The two used to be maintained separately and disagreed on
      # the limits of every single plan.
      - id: render-landing-pricing
        name: Render landing pricing from the plan catalog
        entry: python3 scripts/render_landing_pricing.py
        language: system
        files: ^(backend/app/core/plans\.py|landing/pricing\.html|scripts/render_landing_pricing\.py)$
        pass_filenames: false

      # Inject the shared head/nav/footer into every landing page, so the seven
      # pages cannot drift apart the way they had before partials/ existed.
      - id: build-landing-partials
        name: Build landing pages from partials/
        entry: python3 landing/build.py
        language: system
        files: ^landing/(partials/.*\.html|.*\.html|build\.py)$
        pass_filenames: false

  # AWS deployment configuration (deploy/). The Terraform hooks run in a
  # container for the same reason backend/'s opa-fmt and opa-check do: a
  # contributor who only touches Python should not have to install Terraform.
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Format Terraform
        entry: >-
          bash -c 'docker run --rm -u "$(id -u):$(id -g)"
          -v "$(pwd)/deploy/terraform:/work" -w /work
          hashicorp/terraform:1.14 fmt -recursive .'
        language: system
        files: ^deploy/terraform/.*\.tf$
        pass_filenames: false

      - id: terraform-validate
        name: Validate Terraform
        # Two commands per root, so the image's `terraform` entrypoint has to be
        # replaced with a shell — otherwise `sh -c ...` is passed to Terraform
        # as arguments. HOME is set because the container runs as the calling
        # uid, which has no writable home inside the image.
        #
        # -backend=false so validation needs no S3 bucket and no credentials.
        # Both roots are checked: bootstrap is a separate root with its own
        # provider requirements.
        entry: >-
          bash -c 'for root in . bootstrap; do
          docker run --rm -u "$(id -u):$(id -g)"
          -v "$(pwd)/deploy/terraform:/work" -w "/work/$root"
          -e TF_IN_AUTOMATION=1 -e HOME=/tmp
          --entrypoint sh hashicorp/terraform:1.14
          -c "terraform init -backend=false -input=false >/dev/null && terraform validate"
          || exit 1; done'
        language: system
        files: ^deploy/terraform/.*\.tf$
        pass_filenames: false

      # Coolify substitutes only the variables a compose file names, so one
      # forgotten in the Coolify variant silently takes its default in
      # production rather than failing. This catches that.
      - id: coolify-compose-drift
        name: Check the Coolify compose against compose.yml
        entry: python3 scripts/validate_coolify_compose.py
        language: system
        files: ^(compose\.yml|deploy/coolify/compose\.yml|scripts/validate_coolify_compose\.py)$
        pass_filenames: false

      # The version lives in six places, all derived from the root VERSION
      # file. A stale one is quiet: the dashboard footer and the API's
      # /version/ endpoint would disagree about what is deployed, which is the
      # single question they exist to answer.
      - id: version-drift
        name: Check every manifest against VERSION
        entry: python3 scripts/validate_versions.py
        language: system
        files: ^(VERSION|package\.json|pyproject\.toml|(frontend|action|landing)/package\.json|(backend|docs)/pyproject\.toml|backend/app/__version__\.py|frontend/src/client/core/OpenAPI\.ts|scripts/(_versions|validate_versions|bump_version)\.py)$
        pass_filenames: false

      # The landing page is substituted twice — by entrypoint.sh in a container
      # and by pages-reusable.yml on Cloudflare — so the production URLs are
      # written down twice. A mismatch renders two perfectly valid sites on two
      # different hostnames, which is exactly the kind of thing nobody notices.
      - id: landing-defaults-drift
        name: Check the landing defaults against production.env
        entry: python3 scripts/validate_landing_defaults.py
        language: system
        files: ^(landing/entrypoint\.sh|deploy/cloudflare/env/production\.env|scripts/validate_landing_defaults\.py)$
        pass_filenames: false

      # The project's own rule suite, run against the project's own
      # infrastructure. Any violation fails the commit — see deploy/README.md.
      - id: deploy-terraform-opa
        name: Scan deployment Terraform with the GreenSecOps rules
        entry: python3 scripts/validate_deploy_terraform.py
        language: system
        files: ^(deploy/terraform/.*\.tf(\.json)?|backend/app/rules/iac_terraform/.*\.rego|scripts/(validate_deploy_terraform|opa_terraform_eval)\.py)$
        pass_filenames: false

      # Runs from inside deploy/ansible, which is what makes ansible-lint pick
      # up its ansible.cfg — without that, roles_path never applies and every
      # role in the playbooks fails to resolve. Same working directory as the
      # ansible job in .github/workflows/deploy-checks.yml.
      - id: ansible-lint
        name: Lint Ansible
        entry: bash -c 'cd deploy/ansible && ansible-lint .'
        language: python
        additional_dependencies:
          - "ansible-core>=2.19,<2.21"
          - "ansible-lint>=25.9,<27.0"
        files: ^deploy/ansible/
        pass_filenames: false

  # Conventional commits enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
