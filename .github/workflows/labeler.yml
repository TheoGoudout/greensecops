name: Labels
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

permissions: {}

# Queued rather than cancelled, and that is the whole point of the block: this
# workflow labels a pull request and also triggers on `labeled`, so its own
# labeler job fires a second run. Cancelling would let that second run kill the
# first one's check-labels job — the label-checker's status would then be left
# on whichever run happened to survive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  labeler:
    name: Apply labels
    permissions:
      contents: read
      issues: write # actions/labeler writes labels through the issues API.
      pull-requests: write # To read the changed files and apply the labels.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    name: Check labels
    needs:
      - labeler
    permissions:
      pull-requests: read # To read back the labels the job above applied.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v1.6.66, not v1.6.65. This is a Docker action built from source on
      # every run, and v1.6.65's Dockerfile installs UPX from Debian
      # bullseye — whose security Release file expired on 2026-09-07, so
      # `apt-get update` exits 100 and the build fails before the checker
      # runs at all. v1.6.66 builds on bookworm and drops that step.
      - uses: agilepathway/label-checker@c324842522fbd012e4f590afe3b4e591301322ed # v1.6.66
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
