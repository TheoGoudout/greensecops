name: Labels
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

permissions: {}

# Queued rather than cancelled, and that is the whole point of the block: this
# workflow labels a pull request and also triggers on `labeled`, so its own
# labeler job fires a second run. Cancelling would let that second run kill the
# first one's check-labels job — the label-checker's status would then be left
# on whichever run happened to survive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  labeler:
    name: Apply labels
    permissions:
      contents: read
      issues: write # actions/labeler writes labels through the issues API.
      pull-requests: write # To read the changed files and apply the labels.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    name: Check labels
    needs:
      - labeler
    permissions:
      pull-requests: read # To read back the labels the job above applied.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The published image, pinned by OCI digest, rather than the action's
      # Dockerfile built from source on every run. The source build is what
      # broke here once already: v1.6.65's Dockerfile installs UPX from Debian
      # bullseye, whose security Release file expired on 2026-09-07, so
      # `apt-get update` exited 100 before the checker ran at all. A prebuilt
      # image cannot fail that way, starts faster, and a digest is immutable
      # where a git ref only names the recipe. (A docker:// reference must be
      # pinned by digest, not by a git SHA.) This digest is the v1.6.66 image.
      - uses: docker://agilepathway/pull-request-label-checker@sha256:a61b40c6b9e13e62a8cf5b9810871ea582a21897ebb1a8afc9dfeb98440de323 # v1.6.66
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
