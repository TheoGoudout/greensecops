name: "Conflict detector"
on:
  push:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [synchronize]

permissions: {}

# One run per pull request. Cancelled: the label this applies describes the
# head commit, so a run against an older one has nothing left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: "Check for merge conflicts"
    permissions:
      contents: read
      pull-requests: write # To apply the conflicts label and comment on the pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if PRs have merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "conflicts"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "This pull request has a merge conflict that needs to be resolved."
