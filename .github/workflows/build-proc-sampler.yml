name: Build proc-sampler

on:
  push:
    branches:
      - main
    paths:
      - "action/native/proc-sampler/**"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "action/native/proc-sampler/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request, and per branch for a push.
#
# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. *Not* cancelled for a push to
# main: that run is the branch's own record, and a second merge landing while
# it is still going would erase the first one's result rather than supersede
# it — the check would simply be missing from the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: action/native/proc-sampler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  build:
    name: Build linux/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch:
          - "386"
          - amd64
          - arm64
    defaults:
      run:
        working-directory: action/native/proc-sampler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        # Through GOARCH rather than the matrix expansion: an expansion is
        # pasted into the shell before it runs, an environment variable is not.
        run: go build -o "build/proc-sampler-linux-${GOARCH}" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proc-sampler-linux-${{ matrix.arch }}
          path: action/native/proc-sampler/build/proc-sampler-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
