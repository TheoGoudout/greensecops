name: pre-commit
true:
  pull_request:
    types:
    - opened
    - synchronize
permissions: {}
env:
  HAS_SECRETS: ${{ secrets.PRE_COMMIT != '' }}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - &id001
      name: GreenSecOps Telemetry
      uses: greensecops/greensecops-action@v1
      with:
        greensecops_url: ${{ vars.GREENSECOPS_URL }}
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      name: Checkout PR for own repo
      if: env.HAS_SECRETS == 'true'
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        token: ${{ secrets.PRE_COMMIT }}
        persist-credentials: true
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      name: Checkout PR for fork
      if: env.HAS_SECRETS == 'false'
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.12
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.11'
    - name: Setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.11.4
        cache-dependency-glob: 'requirements**.txt

          pyproject.toml

          uv.lock

          '
    - name: Install backend dependencies
      run: uv sync --all-packages
    - name: Install frontend dependencies
      run: bun ci
    - name: Prepare env files
      run: 'cp .env.example .env

        cp frontend/.env.example frontend/.env

        # FIRST_SUPERUSER_PASSWORD is required but left empty in the example

        # (env_ignore_empty drops empty values), so give it a non-empty value.

        printf ''\nFIRST_SUPERUSER_PASSWORD=ci-not-a-real-password\n'' >> .env

        '
    - name: Run prek - pre-commit
      id: precommit
      run: uv run prek run --from-ref origin/${GITHUB_BASE_REF} --to-ref HEAD --show-diff-on-failure
      continue-on-error: true
    - name: Commit and push changes
      if: env.HAS_SECRETS == 'true'
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"\
        github-actions[bot]@users.noreply.github.com\"\ngit add -A\nif git diff --staged\
        \ --quiet; then\n  echo \"No changes to commit\"\nelse\n  git commit -m \"\
        \U0001F3A8 Auto format and update with pre-commit\"\n  git push\nfi\n"
    - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43
      if: env.HAS_SECRETS == 'false'
      with:
        msg: "\U0001F3A8 Auto format and update with pre-commit"
    - name: Error out on pre-commit errors
      if: steps.precommit.outcome == 'failure'
      run: exit 1
  pre-commit-alls-green:
    if: always()
    needs:
    - pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - *id001
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
      with:
        jobs: ${{ toJSON(needs) }}
