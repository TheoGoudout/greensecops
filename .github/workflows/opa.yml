name: opa

on:
  push:
    branches: [main]
    paths:
      - "backend/app/rules/**"
      - "backend/app/services/terraform/**"
      - "backend/app/services/docker/**"
      - "backend/app/services/ansible/**"
      - "examples/**"
      - "landing/**"
      - "docs/**"
      - "scripts/validate_examples.py"
      - "scripts/validate_terraform_examples.py"
      - "scripts/validate_docker_examples.py"
      - "scripts/validate_ansible_examples.py"
      - "scripts/validate_deploy_terraform.py"
      - "scripts/validate_deploy_ansible.py"
      - "scripts/opa_ansible_eval.py"
      - "scripts/opa_terraform_eval.py"
      - "scripts/opa_eval.py"
      - "scripts/regenerate_terraform_fixtures.py"
      - "scripts/render_landing_examples.py"
      - "scripts/render_landing_pricing.py"
      - "backend/app/core/plans.py"
      - "backend/tests/fixtures/terraform/**"
      - "scripts/opa/**"
      - "deploy/terraform/**"
      - "deploy/ansible/**"
      - ".github/workflows/opa.yml"
  pull_request:
    paths:
      - "backend/app/rules/**"
      - "backend/app/services/terraform/**"
      - "backend/app/services/docker/**"
      - "backend/app/services/ansible/**"
      - "examples/**"
      - "landing/**"
      - "docs/**"
      - "scripts/validate_examples.py"
      - "scripts/validate_terraform_examples.py"
      - "scripts/validate_docker_examples.py"
      - "scripts/validate_ansible_examples.py"
      - "scripts/validate_deploy_terraform.py"
      - "scripts/validate_deploy_ansible.py"
      - "scripts/opa_ansible_eval.py"
      - "scripts/opa_terraform_eval.py"
      - "scripts/opa_eval.py"
      - "scripts/regenerate_terraform_fixtures.py"
      - "scripts/render_landing_examples.py"
      - "scripts/render_landing_pricing.py"
      - "backend/app/core/plans.py"
      - "backend/tests/fixtures/terraform/**"
      - "scripts/opa/**"
      - "deploy/terraform/**"
      - "deploy/ansible/**"
      - ".github/workflows/opa.yml"

permissions: {}

env:
  # Pinned to match opa/Dockerfile so local, server and CI evaluation agree.
  OPA_VERSION: "1.19.0"

jobs:
  opa:
    name: OPA rules & example validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install script dependencies
        # python-hcl2 lets validate_terraform_examples.py reuse the production
        # HCL parse+merge path (backend/app/services/terraform/hcl_parser.py).
        run: pip install "ruamel.yaml>=0.18,<0.19" "python-hcl2>=6.1,<7.0"

      # --strict additionally rejects unused arguments and unused assignments,
      # which are how a rule body silently stops testing what it reads. Kept as
      # the compile gate rather than a lint job: a rule that fails it is wrong,
      # not untidy.
      - name: Check Rego policies compile
        run: opa check --strict backend/app/rules

      - name: Run Rego unit tests
        run: opa test backend/app/rules -v

      - name: Validate workflow examples against the rule suite
        run: python scripts/validate_examples.py

      - name: Validate Terraform examples against the rule suite
        run: python scripts/validate_terraform_examples.py

      - name: Validate Docker examples against the rule suite
        run: python scripts/validate_docker_examples.py

      - name: Validate Ansible examples against the rule suite
        run: python scripts/validate_ansible_examples.py

      # The reference deployment of a product that scans Terraform has to be
      # one its own rules pass. Any violation fails the build.
      - name: Scan the AWS deployment Terraform with the rule suite
        run: python scripts/validate_deploy_terraform.py

      # Same bar for the playbooks that configure those instances.
      - name: Scan the deployment Ansible with the rule suite
        run: python scripts/validate_deploy_ansible.py

      # The backend's Terraform tests replay violations recorded from this
      # suite, because the pytest environment has no opa binary. A rule change
      # can therefore make that recording wrong without touching a single test
      # file — this is what notices. The failure diff doubles as a report of how
      # the change lands on real-world Terraform.
      - name: Check the backend Terraform fixtures match the rule suite
        run: python scripts/regenerate_terraform_fixtures.py --check

      - name: Check landing page is in sync with example files
        run: python scripts/render_landing_examples.py --check

      # The pricing page's numbers are the same numbers the quota enforcer
      # applies. This is what stops the marketing site advertising a limit the
      # product does not actually give you.
      - name: Check landing pricing is in sync with the plan catalog
        run: python scripts/render_landing_pricing.py --check

      # The landing pages share their head, nav and footer from
      # landing/partials/. Editing a page's copy directly instead of the
      # partial is exactly the drift this catches.
      - name: Check landing pages are in sync with partials
        run: python landing/build.py --check
