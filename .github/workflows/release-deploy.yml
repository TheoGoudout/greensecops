name: release-deploy

# Promotes a published release to production, on both platforms.
#
# Triggered by publishing the draft release.yml opened — that click is the
# human decision this whole flow is built around, and it is the only thing that
# moves production. Staging is untouched here: it tracks main automatically
# (pages.yml for the static surfaces, Coolify's own auto-deploy for the API).
#
# The whole promotion is one run, so there is one place to read its status and
# "Re-run failed jobs" re-drives only the half that broke. The workflow_dispatch
# trigger is the same thing from the other direction: name a tag that is already
# released and, optionally, narrow it to one half. That is the shape of the
# half-failed release — Coolify deployed, Cloudflare did not — where restarting
# a rollout that already succeeded is the wrong move.
#
# The two halves run in sequence, backend first, and that ordering is
# load-bearing rather than tidy. The dashboard ships a *generated* OpenAPI
# client, so the two mismatch directions are not equally bad:
#
#   dashboard ahead of API  ->  calls a contract the server has not shipped
#   API ahead of dashboard  ->  fine, as long as the change was additive
#
# Run in parallel, Cloudflare wins the race every time — it is a static build
# and a seconds-long upload, against Coolify pulling images, restarting
# containers and running migrations — so parallel would put production in the
# bad direction on every release. Worse, a Coolify failure after a successful
# Cloudflare deploy would make that direction *permanent* until someone rolled
# back by hand. Sequencing costs one dashboard build on a manual, infrequent,
# reviewer-gated action. See deploy/coolify/README.md.
#
# Sequencing is not a substitute for compatibility: browsers hold the old
# dashboard bundle far longer than either deploy window, so "old client, new
# server" persists for hours regardless. Backward-compatible API changes are
# the real mitigation; this only narrows the window for fresh page loads.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to promote, e.g. v0.12.0"
        required: true
        type: string
      targets:
        description: "Which halves of the promotion to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - coolify
          - cloudflare

permissions: {}

concurrency:
  # One promotion at a time, whatever the tag: two releases rolling out at once
  # would race to set production's image tag. Never cancelled — interrupting a
  # Coolify rollout half-way is exactly the state this workflow exists to avoid.
  group: release-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      run_coolify: ${{ steps.targets.outputs.coolify }}
      run_cloudflare: ${{ steps.targets.outputs.cloudflare }}

    steps:
      # The steps below run scripts from .github/scripts/, so this job needs
      # the repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: .github/scripts/release-deploy/resolve-tag.sh

      - name: Resolve the targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: .github/scripts/release-deploy/resolve-targets.sh

  verify:
    name: Verify the images
    needs: [resolve]
    # Only the API deploy consumes the images. A `targets: cloudflare` run has
    # nothing to wait for, and waiting thirty minutes for it would be the whole
    # cost of the narrow re-drive.
    if: needs.resolve.outputs.run_coolify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      packages: read # To wait for the release images to appear on GHCR.

    steps:
      # The steps below run scripts from .github/scripts/, so this job needs
      # the repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the release images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/release-deploy/wait-for-images.sh

  coolify:
    name: API (production)
    needs: [resolve, verify]
    # No `always()` here, deliberately: this job must not run unless the images
    # are actually in the registry, so the default "every `needs` succeeded"
    # gate is the one we want. `run_coolify` only narrows it further.
    if: needs.resolve.outputs.run_coolify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate. production's protection rules hold this until a
    # reviewer approves, and one approval releases every job in the run that
    # names the environment — so the dashboard job below is covered by the same
    # click rather than asking for a second one.
    environment: production

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the repoint below, not after, and not in pages-reusable.yml where
      # staging's equivalent lives — that workflow runs *after* this job has
      # deployed, so a sync there would reach production's containers one
      # release late, every release.
      #
      # Same values the dashboard is about to be built with, from the same file.
      # The API cannot derive them: SERVICE_URL_* magic is per-service, and the
      # dashboard, landing and docs are Cloudflare Workers rather than services
      # in deploy/coolify/compose.yml, so nothing generates a hostname for them.
      - name: Sync the public URLs
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_PRODUCTION_UUID }}
        run: .github/scripts/shared/coolify-env-sync.sh production "${UUID}"

      - name: Point the resource at the release and deploy it
        id: trigger
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_PRODUCTION_UUID }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: .github/scripts/release-deploy/coolify-deploy.sh

      - name: Monitor the deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: .github/scripts/release-deploy/coolify-monitor.sh

  cloudflare:
    name: Static surfaces (production)
    # Gated on the API being live, not merely started. The coolify job blocks
    # until Coolify reports `finished`, so this ordering is real.
    #
    # `always()` is what lets a *skipped* coolify job through — `targets:
    # cloudflare` skips it, and a plain `needs:` would then skip this job too.
    # A coolify job that actually failed still blocks the dashboard, which is
    # the whole point of the sequencing above.
    needs: [resolve, coolify]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.run_cloudflare == 'true' &&
      needs.coolify.result != 'failure' &&
      needs.coolify.result != 'cancelled'
    uses: ./.github/workflows/pages-reusable.yml
    # See pages.yml: a caller's permissions cap every job in the called
    # workflow, so api-gate's declaration has to be granted here too.
    permissions:
      contents: read
      actions: read # For api-gate, to read this commit's images.yml run.
    with:
      environment: production
    secrets:
      # Named explicitly. pages-reusable.yml declares these as workflow_call
      # secrets and deliberately does not inherit — and omitting them here
      # would not fail: HAS_CLOUDFLARE would simply be false and the run would
      # go green having deployed nothing at all.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  summary:
    name: Summarise
    needs: [resolve, verify, coolify, cloudflare]
    # Runs even when a stage failed or was skipped, so the run's conclusion is
    # the release's conclusion rather than just the last job's.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      # The steps below run scripts from .github/scripts/, so this job needs
      # the repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          TAG: ${{ needs.resolve.outputs.tag || github.event.release.tag_name || inputs.tag }}
          IMAGES: ${{ needs.verify.result }}
          API: ${{ needs.coolify.result }}
          STATIC: ${{ needs.cloudflare.result }}
        run: .github/scripts/release-deploy/report.sh

      # The report above always exits 0 — right for a report, wrong for the last
      # job in the workflow. Without this, a release whose Cloudflare deploy died
      # ended on a green check with the failure buried in a table.
      - name: Fail if any target failed
        env:
          IMAGES: ${{ needs.verify.result }}
          API: ${{ needs.coolify.result }}
          STATIC: ${{ needs.cloudflare.result }}
        run: .github/scripts/release-deploy/fail-if-any-target-failed.sh
