name: Issue Manager
true:
  schedule:
  - cron: 21 17 * * *
  issue_comment:
    types:
    - created
  issues:
    types:
    - labeled
  pull_request_target:
    types:
    - labeled
  workflow_dispatch: null
permissions: {}
jobs:
  issue-manager:
    if: github.repository_owner == 'fastapi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: GreenSecOps Telemetry
      uses: greensecops/greensecops-action@v1
      with:
        greensecops_url: ${{ vars.GREENSECOPS_URL }}
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: tiangolo/issue-manager@2fb3484ec9279485df8659e8ec73de262431737d
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        config: "{\n  \"answered\": {\n    \"delay\": 864000,\n    \"message\": \"\
          Assuming the original need was handled, this will be automatically closed\
          \ now. But feel free to add more comments or create new issues or PRs.\"\
          \n  },\n  \"waiting\": {\n    \"delay\": 2628000,\n    \"message\": \"As\
          \ this PR has been waiting for the original user for a while but seems to\
          \ be inactive, it's now going to be closed. But if there's anyone interested,\
          \ feel free to create a new PR.\",\n    \"reminder\": {\n      \"before\"\
          : \"P3D\",\n      \"message\": \"Heads-up: this will be closed in 3 days\
          \ unless there's new activity.\"\n    }\n  },\n  \"invalid\": {\n    \"\
          delay\": 0,\n    \"message\": \"This was marked as invalid and will be closed\
          \ now. If this is an error, please provide additional details.\"\n  },\n\
          \  \"maybe-ai\": {\n    \"delay\": 0,\n    \"message\": \"This was marked\
          \ as potentially AI generated and will be closed now. If this is an error,\
          \ please provide additional details, make sure to read the docs about contributing\
          \ and AI.\"\n  }\n}\n"
