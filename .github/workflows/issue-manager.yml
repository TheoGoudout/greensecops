name: Issue Manager

on:
  schedule:
    - cron: "21 17 * * *"
  issue_comment:
    types:
      - created
  issues:
    types:
      - labeled
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - labeled
  workflow_dispatch:

permissions: {}

# Serialised across the whole repository, not per issue: the nightly sweep walks
# every open issue and pull request, so two overlapping runs would post the same
# reminder twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  issue-manager:
    name: Manage issues and PRs
    # The guard is inherited from upstream, where it stopped every fork of the
    # template running the issue manager against its own tracker. It kept doing
    # that here — against *this* repository, since the owner is no longer
    # `fastapi`, so the only job in this workflow could never run. Same intent,
    # this repository's owner.
    if: github.repository_owner == 'TheoGoudout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # To comment on and close issues that the config below matches.
      pull-requests: write # Same, for pull requests — `waiting` applies to them.
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: tiangolo/issue-manager@dc846170c36eb62fb434b3d943b36399fe240fb5 # 0.8.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: >
            {
              "answered": {
                "delay": 864000,
                "message": "Assuming the original need was handled, this will be automatically closed now. But feel free to add more comments or create new issues or PRs."
              },
              "waiting": {
                "delay": 2628000,
                "message": "As this PR has been waiting for the original user for a while but seems to be inactive, it's now going to be closed. But if there's anyone interested, feel free to create a new PR.",
                "reminder": {
                  "before": "P3D",
                  "message": "Heads-up: this will be closed in 3 days unless there's new activity."
                }
              },
              "invalid": {
                "delay": 0,
                "message": "This was marked as invalid and will be closed now. If this is an error, please provide additional details."
              },
              "maybe-ai": {
                "delay": 0,
                "message": "This was marked as potentially AI generated and will be closed now. If this is an error, please provide additional details, make sure to read the docs about contributing and AI."
              }
            }
