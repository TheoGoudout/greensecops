name: Smokeshow

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Test Backend]
    types: [completed]

permissions: {}

# Keyed on the commit whose coverage this is, and never cancelled: the run ends
# by setting a commit status, and a cancelled one leaves that status missing
# rather than red.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  smokeshow:
    name: Upload Coverage
    # Only upload coverage when the triggering run succeeded; a failed run
    # never uploads the coverage-html artifact, so downloading it would fail.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out the repository below.
      actions: read # To download the coverage artifact from the triggering run.
      statuses: write # To post the coverage percentage as a commit status.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The tooling interpreter, as in deploy-checks.yml, opa.yml and
          # pre-commit.yml. This job resolves the workspace and runs one
          # uploader; it does not exercise application code, so it has no
          # reason to be on a version of its own — it was on 3.13 for none.
          python-version: "3.11"
          cache: pip
      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.4"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --all-packages --no-dev --group github-actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: uv run smokeshow upload backend/htmlcov
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 90
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }} # zizmor: ignore[secrets-outside-env]
