name: docs

on:
  push:
    branches: [main]
    paths:
      - "backend/app/rules/**"
      - "docs/**"
  pull_request:
    paths:
      - "backend/app/rules/**"
      - "docs/**"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: GreenSecOps Telemetry
        uses: greensecops/greensecops-action@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL || 'http://localhost:8000' }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install docs dependencies
        run: uv sync --package docs

      - name: Build docs
        run: uv run sphinx-build -b html -W docs docs/_build/html
        env:
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GreenSecOps Telemetry
        uses: greensecops/greensecops-action@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL || 'http://localhost:8000' }}
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
