name: docs

on:
  push:
    branches: [main]
    paths:
      - "backend/app/rules/**"
      - "docs/**"
  pull_request:
    paths:
      - "backend/app/rules/**"
      - "docs/**"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@8151315068233342226207013853c7be1e480264 # v7
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --package docs

      - name: Build docs
        run: uv run sphinx-build -b html -W docs docs/_build/html
        env:
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@0dbe9a7cf101410615eda2387d7b006739519523 # v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy documentation
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed8692d6e3398165657368291771 # v5
        id: deployment
