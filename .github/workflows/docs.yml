name: docs

on:
  push:
    branches: [main]
    paths:
      - "backend/app/rules/**"
      - "docs/**"
  pull_request:
    paths:
      - "backend/app/rules/**"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: GreenSecOps Telemetry
        uses: greensecops/greensecops-action@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL }}
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v7

      - name: Install docs dependencies
        run: uv sync --package docs

      - name: Build docs
        run: uv run sphinx-build -b html -W docs docs/_build/html
        env:
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GreenSecOps Telemetry
        uses: greensecops/greensecops-action@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL }}
      - uses: actions/deploy-pages@v5
        id: deployment
