name: images

# Builds the two images the Coolify deployment still needs — the backend and
# the policy server — and publishes them to GHCR as multi-architecture
# manifests covering amd64 and arm64.
#
# The other three images are gone from that deployment: landing, dashboard and
# docs are static and go to Cloudflare Pages instead (.github/workflows/pages.yml).
#
# Both architectures, deliberately. Hetzner's cheapest lines go out of stock
# routinely — CAX (Ampere/arm64) and CX (Intel/amd64) are frequently
# unavailable at the same time, and which one you can actually buy on the day
# decides the architecture. Publishing a manifest that covers both means the
# same tag runs wherever you land, and a later move between ARM and x86 is a
# server rebuild rather than a pipeline change.
#
# Each architecture builds on a native runner, so nothing goes through QEMU —
# emulating the backend build would take roughly ten times as long.
#
# Built here rather than on the target host because a €13/month box is slow
# over `uv sync`, and a Raspberry Pi acting as Coolify's control plane should
# not be building anything at all. Coolify only pulls.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "opa/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      # Push to GHCR with the workflow's own token — no registry credentials
      # stored in the repository.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # Both dimensions are base keys so they form a cross-product: four
        # jobs, one per image per architecture. The `include` entries below
        # each share a key with a base dimension, which makes them selectors
        # that attach the runner and Dockerfile to the matching combinations.
        # Putting platform only in `include` would not work — entries that
        # share no key with the base matrix are merged into *every*
        # combination, so the second would silently overwrite the first and
        # only one architecture would ever be built.
        image: [backend, opa]
        platform: [amd64, arm64]
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: opa
            dockerfile: opa/Dockerfile
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # A registry reference must be lowercase, and github.repository_owner
        # preserves the account's real casing — "TheoGoudout", not
        # "theogoudout" — so interpolating it directly makes every push fail
        # with "invalid reference format". Workflow expressions have no
        # lowercase function, so the conversion happens in the shell.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The build context is the repository root for both images: the
          # backend resolves the uv workspace from the root pyproject.toml and
          # uv.lock, and opa/Dockerfile copies backend/app/rules.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          # Pushed without a tag; the merge job assembles the per-architecture
          # digests into one manifest. Tagging here would have the two
          # architectures overwrite each other.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export the digest
        # The artifact is an empty file whose *name* is the digest; the merge
        # job reads the names and ignores the contents.
        #
        # The `sha256:` prefix has to come off. upload-artifact rejects a colon
        # anywhere in a path — it keeps artifacts extractable on NTFS, where
        # the character is illegal — and the merge job re-adds the prefix when
        # it rebuilds the full references, so leaving it here would produce
        # `image@sha256:sha256:…` even if the upload had succeeded.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [backend, opa]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # Same lowercasing as the build job — see the comment there.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5.8.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Create the multi-architecture manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # Every file here is named for one architecture's digest; the tags
          # come from the metadata action as -t arguments.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Confirm both architectures are present
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${version}" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .platform.architecture' \
            | sort -u | tr '\n' ' ')
          echo "Published ${IMAGE}:${version} for: ${platforms}"
          for arch in amd64 arm64; do
            case " ${platforms} " in
              *" ${arch} "*) ;;
              *) echo "::error::${IMAGE}:${version} has no ${arch} manifest"; exit 1 ;;
            esac
          done
