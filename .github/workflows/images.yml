name: images

# Builds the two images the Coolify deployment still needs — the backend and
# the policy server — and publishes them to GHCR as multi-architecture
# manifests covering amd64 and arm64.
#
# The other three images are gone from that deployment: landing, dashboard and
# docs are static and go to Cloudflare Workers instead
# (.github/workflows/pages.yml).
#
# Both architectures, deliberately. Hetzner's cheapest lines go out of stock
# routinely — CAX (Ampere/arm64) and CX (Intel/amd64) are frequently
# unavailable at the same time, and which one you can actually buy on the day
# decides the architecture. Publishing a manifest that covers both means the
# same tag runs wherever you land, and a later move between ARM and x86 is a
# server rebuild rather than a pipeline change.
#
# Each architecture builds on a native runner, so nothing goes through QEMU —
# emulating the backend build would take roughly ten times as long.
#
# Built here rather than on the target host because a €13/month box is slow
# over `uv sync`, and a Raspberry Pi acting as Coolify's control plane should
# not be building anything at all. Coolify only pulls.

# This workflow does not only build: on `main` it also deploys the staging API,
# in the `deploy-staging` job below. That is deliberate — the deploy has to
# happen *after* the images exist, and here is the only place that knows they
# do. See the comment on that job.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "opa/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
      # Not inputs to the image build — inputs to the staging deploy below,
      # which syncs the resource's public URLs from those files before it
      # deploys. A hostname change reaches the containers only on a deploy, so
      # it has to be able to trigger one.
      - "scripts/coolify_env_sync.sh"
      - "deploy/cloudflare/env/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  # Not cancelled, unlike an ordinary build workflow: this run ends in a Coolify
  # rollout, and interrupting one half-way is the state release-deploy.yml
  # exists to avoid — see its concurrency block. Rapid pushes therefore queue
  # rather than cancel, which also serialises the deploys the same way
  # deploy.yml's `deploy-${{ inputs.environment }}` group does.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      # Push to GHCR with the workflow's own token — no registry credentials
      # stored in the repository.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # Both dimensions are base keys so they form a cross-product: four
        # jobs, one per image per architecture. The `include` entries below
        # each share a key with a base dimension, which makes them selectors
        # that attach the runner and Dockerfile to the matching combinations.
        # Putting platform only in `include` would not work — entries that
        # share no key with the base matrix are merged into *every*
        # combination, so the second would silently overwrite the first and
        # only one architecture would ever be built.
        image: [backend, opa]
        platform: [amd64, arm64]
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: opa
            dockerfile: opa/Dockerfile
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # A registry reference must be lowercase, and github.repository_owner
        # preserves the account's real casing — "TheoGoudout", not
        # "theogoudout" — so interpolating it directly makes every push fail
        # with "invalid reference format". Workflow expressions have no
        # lowercase function, so the conversion happens in the shell.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The build context is the repository root for both images: the
          # backend resolves the uv workspace from the root pyproject.toml and
          # uv.lock, and opa/Dockerfile copies backend/app/rules.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          # Pushed without a tag; the merge job assembles the per-architecture
          # digests into one manifest. Tagging here would have the two
          # architectures overwrite each other.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export the digest
        # The artifact is an empty file whose *name* is the digest; the merge
        # job reads the names and ignores the contents.
        #
        # The `sha256:` prefix has to come off. upload-artifact rejects a colon
        # anywhere in a path — it keeps artifacts extractable on NTFS, where
        # the character is illegal — and the merge job re-adds the prefix when
        # it rebuilds the full references, so leaving it here would produce
        # `image@sha256:sha256:…` even if the upload had succeeded.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [backend, opa]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # Same lowercasing as the build job — see the comment there.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Create the multi-architecture manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # Every file here is named for one architecture's digest; the tags
          # come from the metadata action as -t arguments.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Confirm both architectures are present
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${version}" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .platform.architecture' \
            | sort -u | tr '\n' ' ')
          echo "Published ${IMAGE}:${version} for: ${platforms}"
          for arch in amd64 arm64; do
            case " ${platforms} " in
              *" ${arch} "*) ;;
              *) echo "::error::${IMAGE}:${version} has no ${arch} manifest"; exit 1 ;;
            esac
          done

  deploy-staging:
    name: Deploy the staging API
    needs: [merge]
    # `main` only. A `v*` tag push builds images here too, but promoting one is
    # release-deploy.yml's job and gated on a reviewer — repointing staging at a
    # release tag from here would quietly take it off main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # To confirm the tag this job is about to deploy actually resolves.
      packages: read

    # Why the staging deploy lives at the end of the *image* workflow rather
    # than being left to Coolify's git watcher, which is what used to do it:
    #
    # The watcher fires on the push, and this workflow takes ten to twenty-five
    # minutes to publish the images for that same commit. So the deploy always
    # started before the image it wanted existed, and pulled the previous
    # commit's `latest` instead — while pages.yml put *this* commit's dashboard
    # on Cloudflare in under a minute. The dashboard ships a generated OpenAPI
    # client, so that is the bad direction: a client calling a contract the
    # server has not shipped. release-deploy.yml sequences production precisely
    # to avoid it; staging had nothing.
    #
    # Here, the images provably exist — the merge job just published them. Turn
    # **Automatic Deployment off** on the staging resource in Coolify, or its
    # watcher keeps racing this with a stale deploy. See
    # deploy/coolify/README.md.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skip in one direction only, exactly as the Cloudflare and Coolify
      # checks elsewhere do. No secrets at all is a fork, or an account that
      # runs no Coolify — nothing to deploy. *Some* of them is a
      # misconfiguration, and going green having deployed nothing is how a
      # staging deployment quietly stops tracking main.
      - name: Check the Coolify secrets
        id: secrets
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: |
          set -euo pipefail
          present=0; missing=""
          for name in COOLIFY_URL COOLIFY_TOKEN UUID; do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing="${missing} ${name}"
            fi
          done

          if [ "${present}" -eq 0 ]; then
            echo "::notice::No Coolify secrets on this repository — skipping the staging API deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${missing}" ]; then
            echo "::error::Coolify is partly configured: missing${missing}. Set all three or none — a partial set would deploy nothing and still pass."
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      # The immutable per-commit tag, and the reason this deployment stopped
      # serving stale images. `latest` moves under a name that does not change,
      # so a host that already has it has no reason to look again — Compose's
      # default pull policy is `missing`, and Coolify's ordinary deploy does not
      # force a pull. `sha-<short>` is a reference the host has never seen, so
      # the pull is structural rather than something a flag has to remember to
      # ask for. It also makes "what is staging running?" exactly answerable.
      #
      # The same tag the merge job publishes through metadata-action's
      # `type=sha,format=short`. Confirmed against the registry below rather
      # than assumed: if that format ever changes, this must fail loudly here
      # instead of pinning the resource to a tag that does not exist.
      - name: Resolve and confirm the release tag
        id: tag
        if: steps.secrets.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA:0:7}"
          owner=${OWNER,,}

          echo "${GH_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

          for image in backend opa; do
            reference="${REGISTRY}/${owner}/greensecops-${image}:${tag}"
            if ! docker buildx imagetools inspect "${reference}" >/dev/null 2>&1; then
              echo "::error::${reference} does not exist, so the staging resource must not be pointed at ${tag}. Check the merge job's tags."
              exit 1
            fi
            echo "${reference} ✅"
          done

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Before the deploy, not after. The sync itself does not deploy — Coolify
      # applies a variable on the resource's next deploy — so running it here
      # means a changed hostname reaches the containers in this run rather than
      # on whatever push happens next.
      - name: Sync the public URLs
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: scripts/coolify_env_sync.sh staging "${UUID}"

      - name: Point the resource at the commit and deploy it
        id: trigger
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          status=""; body=""

          # Sets `status` and `body`. Call it directly — never inside $( ),
          # which would run it in a subshell and discard both assignments.
          #
          # Not `curl -f`: that throws away the response body on an error
          # status, which is the half of a 4xx that says *why*.
          call() {
            local method=$1 path=$2
            shift 2
            local response
            response=$(curl -sS --max-time 60 -w '\n%{http_code}' -X "${method}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              "${COOLIFY_URL}/api/v1${path}" "$@")
            status=${response##*$'\n'}
            body=${response%$'\n'*}
          }

          require_ok() {
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "::error::$1 failed with HTTP ${status}: ${body}"
              exit 1
            fi
          }

          # Upsert, because PATCH and POST are not interchangeable here: PATCH
          # updates an existing variable and 404s when there is none; POST
          # creates one. Which applies depends on whether TAG was ever set on
          # this resource by hand — not something a deploy should have an
          # opinion about. The first production release failed exactly here.
          echo "Setting TAG=${TAG}"
          tag_env=$(jq -nc --arg v "${TAG}" '{key: "TAG", value: $v}')
          call PATCH "/applications/${UUID}/envs" -d "${tag_env}"
          if [ "${status}" = "404" ]; then
            echo "  No TAG variable on this resource yet — creating it."
            call POST "/applications/${UUID}/envs" -d "${tag_env}"
            require_ok "Creating the TAG variable"
          else
            require_ok "Setting the TAG variable"
          fi

          # Unlike production, the resource's git ref is not touched: staging
          # tracks `main` permanently, and it is the TAG variable rather than
          # the checked-out tree that decides which image runs.
          echo "Triggering the deploy"
          call POST "/deploy?uuid=${UUID}&force=true"
          require_ok "Triggering the deploy"
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "${body}")

          if [ -z "${deployment}" ]; then
            echo "::error::Coolify accepted the deploy request but returned no deployment_uuid, so it cannot be monitored."
            exit 1
          fi
          echo "deployment=${deployment}" >> "$GITHUB_OUTPUT"
          echo "Deployment ${deployment} queued."

      - name: Monitor the deploy
        # Coolify's queue has a documented long tail of deployments that sit in
        # queued or in_progress indefinitely, so this caps the wait rather than
        # leaning on the job timeout — a capped failure names the deployment and
        # prints its log, a job timeout does neither.
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: |
          set -euo pipefail
          status="unknown"
          for attempt in $(seq 1 90); do
            # Keep the body on an error status so a failure here says what
            # Coolify actually returned rather than just a curl exit code. A
            # transient 5xx mid-rollout is not fatal — retry it rather than
            # abandoning a deploy that is very likely still progressing.
            response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT}")
            http=${response##*$'\n'}
            body=${response%$'\n'*}

            if [ "${http}" -lt 200 ] || [ "${http}" -ge 300 ]; then
              echo "  HTTP ${http} polling the deployment (${attempt}/90): ${body}"
              sleep 10
              continue
            fi

            status=$(jq -r '.status // "unknown"' <<< "${body}")

            case "${status}" in
              finished)
                echo "Staging API deployed at ${TAG} ✅"
                echo "Staging API deployed at \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify reported '${status}' for deployment ${DEPLOYMENT}."
                {
                  echo "## Staging API deploy ${status}"
                  echo
                  echo "Deployment \`${DEPLOYMENT}\` for \`${TAG}\`."
                  jq -r '.deployment_url // empty' <<< "${body}" | sed 's/^/Logs: /'
                  echo
                  echo '```'
                  jq -r '.logs // "(no logs returned)"' <<< "${body}" | tail -100
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              queued|in_progress)
                echo "  ${status} (${attempt}/90)"
                ;;
              *)
                echo "  unrecognised status '${status}' (${attempt}/90)"
                ;;
            esac
            sleep 10
          done

          echo "::error::Deployment ${DEPLOYMENT} was still '${status}' after 15 minutes. Check Coolify — staging is not on ${TAG}."
          exit 1
