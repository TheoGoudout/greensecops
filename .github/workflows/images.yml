name: images

# Builds the two images the Coolify deployment still needs — the backend and
# the policy server — and publishes them to GHCR as multi-architecture
# manifests covering amd64 and arm64.
#
# The other three images are gone from that deployment: landing, dashboard and
# docs are static and go to Cloudflare Workers instead
# (.github/workflows/pages.yml).
#
# Both architectures, deliberately. Hetzner's cheapest lines go out of stock
# routinely — CAX (Ampere/arm64) and CX (Intel/amd64) are frequently
# unavailable at the same time, and which one you can actually buy on the day
# decides the architecture. Publishing a manifest that covers both means the
# same tag runs wherever you land, and a later move between ARM and x86 is a
# server rebuild rather than a pipeline change.
#
# Each architecture builds on a native runner, so nothing goes through QEMU —
# emulating the backend build would take roughly ten times as long.
#
# Built here rather than on the target host because a €13/month box is slow
# over `uv sync`, and a Raspberry Pi acting as Coolify's control plane should
# not be building anything at all. Coolify only pulls.

# This workflow does not only build: on `main` it also deploys the staging API,
# in the `deploy-staging` job below. That is deliberate — the deploy has to
# happen *after* the images exist, and here is the only place that knows they
# do. See the comment on that job.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "opa/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
      - ".github/scripts/**"
      # Not an input to the image build — an input to the staging deploy below,
      # which syncs the resource's public URLs from these files before it
      # deploys. A hostname change reaches the containers only on a deploy, so
      # it has to be able to trigger one.
      - "deploy/cloudflare/env/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  # Not cancelled, unlike an ordinary build workflow: this run ends in a Coolify
  # rollout, and interrupting one half-way is the state release-deploy.yml
  # exists to avoid — see its concurrency block. Rapid pushes therefore queue
  # rather than cancel, which also serialises the deploys the same way
  # deploy.yml's `deploy-${{ inputs.environment }}` group does.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      # No registry credentials are stored in the repository.
      packages: write # To push this architecture's image layers to GHCR.

    strategy:
      fail-fast: false
      matrix:
        # Both dimensions are base keys so they form a cross-product: four
        # jobs, one per image per architecture. The `include` entries below
        # each share a key with a base dimension, which makes them selectors
        # that attach the runner and Dockerfile to the matching combinations.
        # Putting platform only in `include` would not work — entries that
        # share no key with the base matrix are merged into *every*
        # combination, so the second would silently overwrite the first and
        # only one architecture would ever be built.
        image: [backend, opa]
        platform: [amd64, arm64]
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: opa
            dockerfile: opa/Dockerfile
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # A registry reference must be lowercase, and github.repository_owner
        # preserves the account's real casing — "TheoGoudout", not
        # "theogoudout" — so interpolating it directly makes every push fail
        # with "invalid reference format". Workflow expressions have no
        # lowercase function, so the conversion happens in the shell.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The build context is the repository root for both images: the
          # backend resolves the uv workspace from the root pyproject.toml and
          # uv.lock, and opa/Dockerfile copies backend/app/rules.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          # Pushed without a tag; the merge job assembles the per-architecture
          # digests into one manifest. Tagging here would have the two
          # architectures overwrite each other.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: .github/scripts/images/export-digest.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    permissions:
      contents: read
      packages: write # To publish the multi-architecture manifest to GHCR.

    strategy:
      fail-fast: false
      matrix:
        image: [backend, opa]

    steps:
      # The steps below run scripts from .github/scripts/, so this job needs
      # the repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        id: image
        # Same lowercasing as the build job — see the comment there.
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/greensecops-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
        shell: bash

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Create the multi-architecture manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: .github/scripts/images/create-manifest.sh /tmp/digests

      - name: Confirm both architectures are present
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: .github/scripts/images/confirm-architectures.sh

  deploy-staging:
    name: Deploy the staging API
    needs: [merge]
    # `main` only. A `v*` tag push builds images here too, but promoting one is
    # release-deploy.yml's job and gated on a reviewer — repointing staging at a
    # release tag from here would quietly take it off main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Coolify credentials below belong to this environment, not to the
    # repository: binding the job scopes them to the one deploy that needs them,
    # and gives the run a deployment record on `staging`. Unlike `production`,
    # staging carries no reviewer rule, so nothing here waits for a click. See
    # deploy/README.md.
    environment: staging

    permissions:
      contents: read
      packages: read # To confirm the tag this job is about to deploy actually resolves.

    # Why the staging deploy lives at the end of the *image* workflow rather
    # than being left to Coolify's git watcher, which is what used to do it:
    #
    # The watcher fires on the push, and this workflow takes ten to twenty-five
    # minutes to publish the images for that same commit. So the deploy always
    # started before the image it wanted existed, and pulled the previous
    # commit's `latest` instead — while pages.yml put *this* commit's dashboard
    # on Cloudflare in under a minute. The dashboard ships a generated OpenAPI
    # client, so that is the bad direction: a client calling a contract the
    # server has not shipped. release-deploy.yml sequences production precisely
    # to avoid it; staging had nothing.
    #
    # Here, the images provably exist — the merge job just published them. Turn
    # **Automatic Deployment off** on the staging resource in Coolify, or its
    # watcher keeps racing this with a stale deploy. See
    # deploy/coolify/README.md.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Coolify secrets
        id: secrets
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: .github/scripts/images/check-coolify-secrets.sh

      - name: Resolve and confirm the release tag
        id: tag
        if: steps.secrets.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/images/resolve-tag.sh

      # Before the deploy, not after. The sync itself does not deploy — Coolify
      # applies a variable on the resource's next deploy — so running it here
      # means a changed hostname reaches the containers in this run rather than
      # on whatever push happens next.
      - name: Sync the public URLs
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: .github/scripts/shared/coolify-env-sync.sh staging "${UUID}"

      - name: Point the resource at the commit and deploy it
        id: trigger
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/images/coolify-deploy.sh

      - name: Monitor the deploy
        if: steps.secrets.outputs.run == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: .github/scripts/images/coolify-monitor.sh
