name: Deploy an environment

# One environment's rollout: the API to Coolify, then the three static
# surfaces to Cloudflare — the API upgraded before the dashboard that calls it,
# and an API that failed to deploy holding the dashboard back.
#
# The environment is the only thing that changes between staging and
# production. release.yml calls this once per environment a release targets —
# staging for a pre-release, staging and production (in parallel) for a stable
# release — and each call reads that GitHub Environment's own secrets and
# protection rules.
#
# Dev is not deployed from here: Coolify and Cloudflare Workers Builds deploy it
# themselves from main (see deploy/coolify/README.md and deployment.md).

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy: staging or production"
        required: true
        type: string
      ref:
        description: "Release tag to deploy — also the image tag"
        required: true
        type: string
      coolify:
        description: "Deploy the API"
        required: false
        default: true
        type: boolean
      cloudflare:
        description: "Deploy the static surfaces"
        required: false
        default: true
        type: boolean
    secrets:
      COOLIFY_URL:
        required: false
      COOLIFY_API_TOKEN:
        required: false
      COOLIFY_APP_UUID:
        required: false
      COOLIFY_TOKEN:
        required: false
      COOLIFY_STAGING_UUID:
        required: false
      COOLIFY_PRODUCTION_UUID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

jobs:
  coolify:
    name: API
    if: inputs.coolify
    permissions:
      contents: read
      packages: read # deploy-coolify.yml confirms the images exist.
    uses: ./.github/workflows/deploy-coolify.yml # zizmor: ignore[self-repository] -- `./`, not `$/`: changing reference syntax is deliberate, not a lint fix
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      image_tag: ${{ inputs.ref }}
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_STAGING_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
      COOLIFY_PRODUCTION_UUID: ${{ secrets.COOLIFY_PRODUCTION_UUID }}

  cloudflare:
    name: Static surfaces
    needs: coolify
    # `always()` lets a *skipped* API deploy (targets: cloudflare) through; an
    # API deploy that failed or was cancelled still holds the dashboard back.
    if: >-
      always() &&
      inputs.cloudflare &&
      needs.coolify.result != 'failure' &&
      needs.coolify.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/pages-reusable.yml # zizmor: ignore[self-repository] -- `./`, not `$/`: changing reference syntax is deliberate, not a lint fix
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
    secrets:
      # Named explicitly: omitting them would not fail — HAS_CLOUDFLARE would
      # be false and the run would go green having deployed nothing.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
