name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

# One run per pull request, and per branch for a push.
#
# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. *Not* cancelled for a push to
# main: that run is the branch's own record, and a second merge landing while
# it is still going would erase the first one's result rather than supersede
# it — the check would simply be missing from the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 10
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_HEX_40_GITHUBWEBHOOKSECRET: 0000000000000000000000000000000000000000
      SERVICE_URL_BACKEND: http://localhost:8000
      SERVICE_URL_FRONTEND: http://localhost
      SERVICE_URL_DOCS: http://localhost:3002
      SERVICE_URL_LANDING: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: .github/scripts/shared/prepare-env-files.sh
      - run: docker compose -f compose.yml build
      - run: docker compose -f compose.yml down -v --remove-orphans
      # The two static sites are waited on alongside the app services because
      # building their images proves nothing about their boot: landing templates
      # the shipped pages in its entrypoint and docs serves a Sphinx build, and
      # either failing leaves a restart-looping container only a started
      # container shows.
      - run: docker compose -f compose.yml up -d --wait backend frontend landing docs
      - run: docker compose -f compose.yml down -v --remove-orphans
