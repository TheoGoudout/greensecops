name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# One run per pull request, and per branch for a push.
#
# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. *Not* cancelled for a push to
# main: that run is the branch's own record, and a second merge landing while
# it is still going would erase the first one's result rather than supersede
# it — the check would simply be missing from the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 10
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_HEX_40_GITHUBWEBHOOKSECRET: 0000000000000000000000000000000000000000
      SERVICE_URL_BACKEND: http://localhost:8000
      SERVICE_URL_FRONTEND: http://localhost
      SERVICE_URL_DOCS: http://localhost:3002
      SERVICE_URL_LANDING: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: .github/scripts/shared/prepare-env-files.sh
      - run: docker compose -f compose.yml build
      # The two static sites are waited on alongside the app services because
      # building their images proves nothing about their boot: landing templates
      # the shipped pages in its entrypoint and docs serves a Sphinx build, and
      # either failing leaves a restart-looping container only a started
      # container shows.
      - run: docker compose -f compose.yml up -d --wait backend frontend landing docs
      - name: Show the logs
        if: failure()
        run: docker compose -f compose.yml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yml down -v --remove-orphans

  # The stack a contributor runs: compose.yml with compose.override.yml on top,
  # which swaps in the hot-reloading backend and the Vite dev server and
  # publishes their ports. Nothing else brings it up before someone's first
  # `docker compose up` after a merge.
  dev:
    name: Local development stack
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 15
    env:
      # Same values as the job above, plus the plain variables
      # compose.override.yml reads (it takes precedence over compose.yml's
      # Coolify variables, so these must be set explicitly), as in
      # playwright.yml.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_HEX_40_GITHUBWEBHOOKSECRET: 0000000000000000000000000000000000000000
      SERVICE_URL_BACKEND: http://localhost:8000
      SERVICE_URL_FRONTEND: http://localhost:5173
      SERVICE_URL_DOCS: http://localhost:3002
      SERVICE_URL_LANDING: http://localhost:3001
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      SECRET_KEY: changethischangethischangethischangethischangethischangethischanget
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: .github/scripts/shared/prepare-env-files.sh
      - run: docker compose build backend frontend
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300 backend frontend
      - name: Test backend is up
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 http://localhost:8000/api/v1/system/health
      - name: Test frontend is up
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null http://localhost:5173
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
