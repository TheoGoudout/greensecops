name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: ${{ secrets.SERVICE_PASSWORD_POSTGRES }}
      SERVICE_PASSWORD_64_SECRETKEY: ${{ secrets.SERVICE_PASSWORD_64_SECRETKEY }}
      SERVICE_PASSWORD_FIRSTSUPERUSER: ${{ secrets.SERVICE_PASSWORD_FIRSTSUPERUSER }}
      SERVICE_URL_BACKEND: ${{ vars.SERVICE_URL_BACKEND }}
      SERVICE_URL_FRONTEND: ${{ vars.SERVICE_URL_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare env files
        run: cp .env.example .env && cp frontend/.env.example frontend/.env
      - run: docker compose -f compose.yml build
      - run: docker compose -f compose.yml down -v --remove-orphans
      - run: docker compose -f compose.yml up -d --wait backend frontend
      - run: docker compose -f compose.yml down -v --remove-orphans
