name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: ${{ secrets.SERVICE_PASSWORD_POSTGRES }}
      SERVICE_PASSWORD_64_SECRETKEY: ${{ secrets.SERVICE_PASSWORD_64_SECRETKEY }}
      SERVICE_PASSWORD_FIRSTSUPERUSER: ${{ secrets.SERVICE_PASSWORD_FIRSTSUPERUSER }}
      SERVICE_HEX_40_GITHUBWEBHOOKSECRET: 0000000000000000000000000000000000000000
      SERVICE_URL_BACKEND: ${{ vars.SERVICE_URL_BACKEND }}
      SERVICE_URL_FRONTEND: ${{ vars.SERVICE_URL_FRONTEND }}
      SERVICE_URL_DOCS: ${{ vars.SERVICE_URL_DOCS }}
      SERVICE_URL_LANDING: ${{ vars.SERVICE_URL_LANDING }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: cp .env.example .env && cp frontend/.env.example frontend/.env
      - run: docker compose -f compose.yml build
      - run: docker compose -f compose.yml down -v --remove-orphans
      # The two static sites are waited on alongside the app services because
      # building their images proves nothing about their boot: landing templates
      # the shipped pages in its entrypoint and docs serves a Sphinx build, and
      # either failing leaves a restart-looping container only a started
      # container shows.
      - run: docker compose -f compose.yml up -d --wait backend frontend landing docs
      - run: docker compose -f compose.yml down -v --remove-orphans
