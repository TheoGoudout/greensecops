name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_FQDN_BACKEND: localhost:8000
      SERVICE_FQDN_FRONTEND: localhost:5173
      SERVICE_FQDN_ADMINER: localhost:8080
      SERVICE_FQDN_FLOWER: localhost:5555
      # Plain vars required by compose.override.yml (override takes precedence
      # over compose.yml Coolify vars, so these must be set explicitly in CI).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      SECRET_KEY: changethischangethischangethischangethischangethischangethischanget
      FIRST_SUPERUSER_PASSWORD: testpassword
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare env files
        run: cp .env.example .env && cp frontend/.env.example frontend/.env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
