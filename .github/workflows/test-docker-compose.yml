name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare env files
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env
          # Supply required secrets that compose.yml enforces with ?Variable not set.
          printf '\nPOSTGRES_PASSWORD=testpassword\n' >> .env
          printf 'SECRET_KEY=changethischangethischangethischangethischangethischangethischanget\n' >> .env
          printf 'FIRST_SUPERUSER_PASSWORD=testpassword\n' >> .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
