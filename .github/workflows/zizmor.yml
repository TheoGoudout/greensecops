name: Zizmor

# Static analysis of this repository's own GitHub Actions workflows.
#
# This used to be one job that could not fail. `zizmor-action` defaults to
# `advanced-security: true`, which makes it run zizmor with `--format=sarif`,
# and zizmor deliberately exits 0 under SARIF — the consumer is expected to
# decide what blocks. So the job uploaded findings to the Security tab and went
# green, every time, for 105 consecutive runs, while holding a real
# impostor-commit on the workflow that mints our AWS deploy credentials. It also
# only ran on `push` to main, so nothing was ever checked before merge.
#
# The two jobs below separate the two things that were conflated:
#
#   gate    runs on pull requests and on main, fails the build. Uses
#           `--format=github`, which does exit non-zero, so a finding is a red
#           check on the pull request that introduced it, annotated on the
#           offending line.
#
#   report  runs on main only, never fails. Uploads the full picture — including
#           the low-confidence findings the gate deliberately lets through — to
#           code scanning, so nothing is lost by making the gate strict.
#
# What the gate blocks on is set by `min-confidence: medium`, not by severity.
# Severity says how bad a finding would be if real; confidence says how sure
# zizmor is that it *is* real. A blocking check should only ever be spent on the
# second. Today that distinction drops exactly the findings that are wrong about
# this repository — `cache-poisoning` on pages-reusable.yml, which is
# High severity but Low confidence, and not reachable here: a pull request's
# Actions cache is scoped to its own ref and cannot be read by a run on main,
# and the Cloudflare publish is behind an environment approval besides. The
# report job still records it.
#
# Which audits run, and which publishers we are willing to run at all, live in
# .github/zizmor.yml — zizmor discovers that file itself, so neither job passes
# a `config:` input.

# The path filter covers everything zizmor collects: workflows, composite
# actions, pre-commit configuration, and its own ruleset. A push touching none
# of them — the release-notes commits, most backend work — runs neither job,
# which is where nearly all of the saving is.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/zizmor.yml
      - action/.github/workflows/**
      - action/action.yml
      - "**/.pre-commit-config.yaml"
  push:
    branches:
      - main
    # Duplicated from pull_request above: GitHub Actions does not support YAML
    # anchors, so the two lists have to be kept in step by hand — same as
    # pages.yml.
    paths:
      - .github/workflows/**
      - .github/zizmor.yml
      - action/.github/workflows/**
      - action/action.yml
      - "**/.pre-commit-config.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Mutually exclusive with advanced-security, which is why this job
          # cannot also be the one that uploads SARIF. `annotations` is what
          # selects `--format=github`, and with it a non-zero exit on findings.
          advanced-security: false
          annotations: true
          # Online audits are the reason this job is worth having. Every
          # offline audit is reproducible from a pre-commit hook; only these
          # can tell that a pinned SHA is not in the repository it claims to
          # come from, or that a version comment no longer matches its pin.
          online-audits: true
          min-confidence: medium

  report:
    name: Report to code scanning
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # No thresholds: this is the record, not the gate. Anything the gate
          # lets through still has to be visible somewhere, and this is where.
          advanced-security: true
