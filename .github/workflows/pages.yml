name: pages

# Publishes the three static surfaces — landing, dashboard and docs — to
# Cloudflare Workers, so they never occupy a container on the application host.
#
# Only the API is genuinely dynamic. Serving the other three from a CDN removes
# three nginx containers from the deployment and puts them behind unlimited
# free bandwidth, which is why deploy/coolify/ can run the whole backend on one
# small box. See deploy/coolify/README.md.
#
# Workers rather than Pages: Cloudflare's static-asset requests are free and
# unmetered on both, but Pages is feature-frozen — Workers Logs, Logpush and
# gradual deployments are Workers-only. Each surface carries its own
# wrangler.jsonc next to the thing it deploys; this file only builds and hands
# off. See https://developers.cloudflare.com/workers/static-assets/.
#
# `packageManager: npm` is set on every wrangler-action step rather than left to
# the action's auto-detection, which looks for a lockfile in the working
# directory only. There is none in landing/, frontend/ or docs/ today, so it
# would pick npm anyway — but a stray bun.lock in landing/ or docs/ would flip
# it to bun, which those two jobs never install.
#
# Requires two repository secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# and the PUBLIC_* repository variables. Publishing is skipped when the token is
# absent, so a fork never fails on this — but the config validation below still
# runs, on pull requests too, because `deploy --dry-run` needs no credentials.

on:
  push:
    branches: [main]
    # Duplicated under pull_request below: GitHub Actions does not support YAML
    # anchors, so the two lists have to be kept in step by hand.
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a deploy is reproducible: wrangler-action installs whatever is
  # latest on npm otherwise, which makes the deploying version a function of
  # the date rather than of this repository.
  WRANGLER_VERSION: "4.118.0"
  # Publishing only happens from main, and only when the account is configured.
  # Pull requests validate the configuration and stop there.
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' }}

jobs:
  landing:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install envsubst
        # gettext-base is present on the current runner image, but the landing
        # build silently produces pages full of literal ${APP_URL} if it ever
        # is not — installing it explicitly makes that a build failure instead.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base

      - name: Substitute the site's URLs and contact addresses
        # landing/entrypoint.sh does this at container start-up. There is no
        # container here, so the same substitution happens at build time from
        # the same variable list — keep the two in step.
        env:
          APP_URL: ${{ vars.PUBLIC_APP_URL }}
          DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
          MARKETING_URL: ${{ vars.PUBLIC_MARKETING_URL }}
          SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
          SALES_EMAIL: ${{ vars.PUBLIC_SALES_EMAIL }}
          LEGAL_EMAIL: ${{ vars.PUBLIC_LEGAL_EMAIL }}
          PRIVACY_EMAIL: ${{ vars.PUBLIC_PRIVACY_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p landing/dist
          cp -r landing/assets landing/dist/
          for f in landing/*.html; do
            envsubst '${APP_URL} ${DOCS_URL} ${MARKETING_URL} ${SUPPORT_EMAIL} ${SALES_EMAIL} ${LEGAL_EMAIL} ${PRIVACY_EMAIL}' \
              < "$f" > "landing/dist/$(basename "$f")"
          done
          # Reproduces `error_page 404 /index.html` from landing/nginx.conf.
          # landing/wrangler.jsonc sets not_found_handling to "404-page", which
          # serves this file — with a real 404 status — for anything unmatched.
          # The extensionless paths the site links to need no rule: Workers'
          # default html_handling resolves /pricing to pricing.html, which is
          # the rest of nginx's `try_files $uri $uri.html`.
          cp landing/dist/index.html landing/dist/404.html
          cp deploy/cloudflare/landing/_headers landing/dist/_headers

      - name: Validate the Worker configuration
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: landing
          # --dry-run resolves the config and the asset directory without
          # contacting the account, so this runs on forks and pull requests.
          command: deploy --dry-run

      - name: Publish
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: landing
          command: deploy

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun ci

      - name: Build
        # The same VITE_* arguments frontend/Dockerfile bakes in. They end up
        # in the shipped bundle either way, so they are repository variables
        # rather than secrets.
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_GREENSECOPS_PUBLIC_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_CLIENT_ID }}
          VITE_GITHUB_APP_NAME: ${{ vars.PUBLIC_GITHUB_APP_NAME }}
        run: bun run build

      - name: Add the response headers
        # SPA routing needs no file: frontend/wrangler.jsonc sets
        # not_found_handling to "single-page-application", which is what serves
        # index.html with a 200 for every path TanStack Router owns.
        run: cp deploy/cloudflare/frontend/_headers frontend/dist/_headers

      - name: Validate the Worker configuration
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: frontend
          command: deploy --dry-run

      - name: Publish
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: frontend
          command: deploy

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.4"
          enable-cache: true

      - name: Build
        # -W matches docs/Dockerfile and .github/workflows/docs.yml: a malformed
        # rule METADATA block should fail the build, not ship a broken page.
        env:
          DOCS_BASE_URL: ${{ vars.PUBLIC_DOCS_URL }}
        run: |
          uv sync --package docs
          uv run sphinx-build -b html -W docs docs/_build/html

      - name: Add the response headers
        run: cp deploy/cloudflare/docs/_headers docs/_build/html/_headers

      - name: Validate the Worker configuration
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: docs
          command: deploy --dry-run

      - name: Publish
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: docs
          command: deploy
