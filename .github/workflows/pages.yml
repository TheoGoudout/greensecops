name: pages

# Publishes the three static surfaces — landing, dashboard and docs — to
# Cloudflare Workers, so they never occupy a container on the application host.
#
# Only the API is genuinely dynamic. Serving the other three from a CDN removes
# three nginx containers from the deployment and puts them behind unlimited
# free bandwidth, which is why deploy/coolify/ can run the whole backend on one
# small box. See deploy/coolify/README.md.
#
# Workers rather than Pages: Cloudflare's static-asset requests are free and
# unmetered on both, but Pages is feature-frozen — Workers Logs, Logpush and the
# versions this workflow uses for pull-request previews are Workers-only. Each
# surface carries its own wrangler.jsonc next to the thing it deploys; the
# mechanics live in pages-reusable.yml and this file only routes events to
# environments. See https://developers.cloudflare.com/workers/static-assets/.
#
# Which event goes where:
#
#   push to main         → staging, automatically
#   workflow_dispatch    → staging or production, whichever was chosen
#   pull_request         → a throwaway preview version of the staging Worker
#
# Production is deliberately not automatic. The dashboard ships a generated
# OpenAPI client and the API is promoted by hand (Coolify's Deploy button, or
# deploy.yml on AWS), so a dashboard that raced ahead of the backend on every
# merge would break against a contract the server had not shipped yet. Making
# both promotions manual lets them happen in one sitting. It is also why this
# is not tag-driven: no part of this repository releases by tag, and gating only
# the static half on tags would widen that gap rather than close it.
#
# Two guards keep production off the automatic path. The `if:` conditions below
# are the visible one; the load-bearing one is the `production` GitHub
# Environment's deployment-branch rule, which pins it to main and cannot be
# bypassed by editing this file on a branch. Set both — see deploy/README.md.

on:
  push:
    branches: [main]
    # Duplicated under pull_request below: GitHub Actions does not support YAML
    # anchors, so the two lists have to be kept in step by hand.
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-reusable.yml"
  pull_request:
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-reusable.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions: {}

jobs:
  staging:
    name: Staging
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/pages-reusable.yml
    permissions:
      contents: read
    with:
      environment: staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    uses: ./.github/workflows/pages-reusable.yml
    permissions:
      contents: read
    with:
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pages-reusable.yml
    permissions:
      contents: read
    with:
      # Previews build against staging — its variables, its Worker, its
      # noindex headers — so an unreviewed branch can never resolve to the
      # production API or touch the production Worker.
      environment: staging
      preview: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Preview URLs
    needs: preview
    # Lives here rather than in pages-reusable.yml because a called workflow's
    # permissions are validated statically across every one of its jobs, before
    # any `if:` is evaluated. A comment job in there asking for
    # pull-requests:write failed the staging and production callers at startup
    # — they grant only contents:read, and no condition could talk GitHub out
    # of it. Here the permission is scoped to the one path that needs it.
    #
    # Skipped when there is no URL to report: a fork gets no secrets, so
    # nothing was uploaded and its token could not comment anyway.
    if: needs.preview.outputs.frontend-preview-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          LANDING_URL: ${{ needs.preview.outputs.landing-preview-url }}
          FRONTEND_URL: ${{ needs.preview.outputs.frontend-preview-url }}
          DOCS_URL: ${{ needs.preview.outputs.docs-preview-url }}
          SHA: ${{ github.sha }}
        # One comment per pull request, edited in place. A comment per push
        # would bury the review under deployment noise on any branch that takes
        # more than a couple of rounds, which is most of them. The marker is
        # how the comment finds itself again on the next run.
        run: |
          set -euo pipefail
          marker='<!-- pages-preview -->'

          body=$(cat <<EOF
          ${marker}
          ### Preview

          | Surface | URL |
          |---|---|
          | Landing | ${LANDING_URL:-—} |
          | Dashboard | ${FRONTEND_URL:-—} |
          | Documentation | ${DOCS_URL:-—} |

          Built from \`${SHA}\` against the **staging** API and marked
          \`noindex\`. These are Worker versions, not deployments — the staging
          site itself still serves \`main\`.
          EOF
          )

          # --paginate runs the filter once per page, so a match on any page
          # prints an id and the rest print nothing. Take the first, without a
          # pipe: `| head -1` would close gh's stdout early on a long thread and
          # turn the SIGPIPE into a failure under `set -o pipefail`.
          ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")
          id=${ids%%$'\n'*}

          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="${body}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}"
          fi
