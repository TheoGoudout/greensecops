name: pages

# Publishes the three static surfaces — landing, dashboard and docs — to
# Cloudflare Workers, so they never occupy a container on the application host.
#
# Only the API is genuinely dynamic. Serving the other three from a CDN removes
# three nginx containers from the deployment and puts them behind unlimited
# free bandwidth, which is why deploy/coolify/ can run the whole backend on one
# small box. See deploy/coolify/README.md.
#
# Workers rather than Pages: Cloudflare's static-asset requests are free and
# unmetered on both, but Pages is feature-frozen — Workers Logs, Logpush and the
# versions this workflow uses for pull-request previews are Workers-only. Each
# surface carries its own wrangler.jsonc next to the thing it deploys; the
# mechanics live in pages-reusable.yml and this file only routes events to
# environments. See https://developers.cloudflare.com/workers/static-assets/.
#
# Which event goes where:
#
#   push to main         → staging, automatically
#   workflow_dispatch    → staging or production, whichever was chosen
#   pull_request         → a throwaway preview version of the staging Worker
#
# Production is deliberately not automatic. The dashboard ships a generated
# OpenAPI client, so a dashboard that raced ahead of the backend on every merge
# would break against a contract the server had not shipped yet.
#
# The ordinary way to reach production is now release-deploy.yml, which calls
# pages-reusable.yml directly after it has deployed the API and waited for
# Coolify to report the deployment finished. The `production` dispatch option
# here remains as the manual escape hatch — republishing the static surfaces
# without cutting a release, when only they need it.
#
# Two guards keep production off the automatic path. The `if:` conditions below
# are the visible one; the load-bearing one is the `production` GitHub
# Environment's deployment rule, which admits only `main` and `v*` tags and
# cannot be bypassed by editing this file on a branch. Set both — see
# deploy/README.md.

on:
  push:
    branches: [main]
    # Duplicated under pull_request below: GitHub Actions does not support YAML
    # anchors, so the two lists have to be kept in step by hand.
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-reusable.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "landing/**"
      - "frontend/**"
      - "docs/**"
      - "backend/app/rules/**"
      - "examples/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-reusable.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions: {}

# Cancelled on pull requests only. A preview version is disposable, so a new
# push should replace the one in flight — but the `push` to main path publishes
# the staging Workers, and interrupting a publish half-way leaves the three
# surfaces on two different builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staging:
    name: Staging
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/pages-reusable.yml
    # A caller's permissions are the ceiling for every job in the called
    # workflow, and GitHub validates them statically across all of them before
    # any `if:` is evaluated — so api-gate's `actions: read` is needed on every
    # caller, not only the staging one whose api-gate step does any work.
    permissions:
      contents: read
      actions: read # For api-gate, to read this commit's images.yml run.
    with:
      environment: staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    uses: ./.github/workflows/pages-reusable.yml
    # A caller's permissions are the ceiling for every job in the called
    # workflow, and GitHub validates them statically across all of them before
    # any `if:` is evaluated — so api-gate's `actions: read` is needed on every
    # caller, not only the staging one whose api-gate step does any work.
    permissions:
      contents: read
      actions: read # For api-gate, to read this commit's images.yml run.
    with:
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pages-reusable.yml
    # A caller's permissions are the ceiling for every job in the called
    # workflow, and GitHub validates them statically across all of them before
    # any `if:` is evaluated — so api-gate's `actions: read` is needed on every
    # caller, not only the staging one whose api-gate step does any work.
    permissions:
      contents: read
      actions: read # For api-gate, to read this commit's images.yml run.
    with:
      # Previews build against staging — its variables, its Worker, its
      # noindex headers — so an unreviewed branch can never resolve to the
      # production API or touch the production Worker.
      environment: staging
      preview: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Preview URLs
    needs: preview
    # Lives here rather than in pages-reusable.yml because a called workflow's
    # permissions are validated statically across every one of its jobs, before
    # any `if:` is evaluated. A comment job in there asking for
    # pull-requests:write failed the staging and production callers at startup
    # — they grant only contents:read, and no condition could talk GitHub out
    # of it. Here the permission is scoped to the one path that needs it.
    #
    # Skipped when there is no URL to report: a fork gets no secrets, so
    # nothing was uploaded and its token could not comment anyway.
    if: needs.preview.outputs.frontend-preview-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write # To post and update the preview-URL comment below.

    steps:
      # The steps below run scripts from .github/scripts/, so this job needs
      # the repository even though it builds nothing from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          LANDING_URL: ${{ needs.preview.outputs.landing-preview-url }}
          FRONTEND_URL: ${{ needs.preview.outputs.frontend-preview-url }}
          DOCS_URL: ${{ needs.preview.outputs.docs-preview-url }}
          # head.sha, not github.sha: on a pull_request event the latter is the
          # ephemeral merge commit, which is not a commit on the branch and
          # cannot be looked up by anyone reading the comment.
          SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pages/preview-comment.sh
