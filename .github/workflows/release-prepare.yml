name: Prepare Release

# Cuts a release: Actions → Prepare Release → Run workflow, pick a bump.
#
# This is the first half of a two-step promotion. It changes nothing that is
# deployed — it checks main is green, bumps the version everywhere, writes the
# release notes from the pull requests merged since the last release, and opens
# a **draft** GitHub release. It does **not** create the tag. Publishing that
# draft is what creates the tag (GitHub does it, at the commit the draft
# targets) and what promotes production, via release.yml.
#
# The draft is the review gate, and leaving the tag to it makes a tag without a
# release impossible: this workflow used to push the tag itself, so a run that
# failed after the push left a tag nothing would ever publish. Everything here
# is reversible with a revert, because nothing has been tagged or deployed.
#
# What it writes, all from the root VERSION file (scripts/_versions.py has the
# list): frontend/package.json, action/package.json, backend/pyproject.toml,
# docs/pyproject.toml, backend/app/__version__.py, and uv.lock.
#
# The tag push that publishing performs is what starts images.yml, which
# publishes ghcr.io/<owner>/greensecops-{backend,opa}:vX.Y.Z; release.yml
# waits for those images before deploying. The bump commit has to be pushed
# with the PAT rather than GITHUB_TOKEN: a push authenticated with GITHUB_TOKEN
# does not trigger other workflows, so the released commit would get no CI.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Exact version, e.g. 0.11.0 or 0.11.0-rc1 (overrides bump)"
        required: false
        type: string
        default: ""

permissions: {}

# The `secrets` context is not available in a step-level `if`, so surface the
# presence of the token as an env var. RELEASE_TOKEN is the name the other
# repositories use; LATEST_CHANGES, the older one, is read while it exists.
env:
  HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' || secrets.LATEST_CHANGES != '' }}

concurrency:
  # Two releases cut at once would both push a bump to main and both open a
  # draft. Never cancelled — an interrupted run is the state that is hard to
  # reason about.
  group: release-prepare
  cancel-in-progress: false

jobs:
  release:
    name: Cut the release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read # To read main's workflow runs, for the green check.
      pull-requests: read # To read merged pull requests' titles and labels, for the notes.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to notice an existing one and to order the new
          # version against them, and the full history so the rebase below has
          # something to rebase onto.
          fetch-depth: 0
          fetch-tags: true
          # The push uses an explicit remote URL carrying the PAT (see the
          # "Push the bump to main" step), which keeps the credential out of the
          # checkout and out of .git/config — the same shape
          # sync-action-repo.yml uses.
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.4"
          enable-cache: true

      - name: Require a release token
        if: env.HAS_RELEASE_TOKEN != 'true'
        run: .github/scripts/release-prepare/require-a-release-token.sh

      - name: Refuse to release from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: .github/scripts/release-prepare/refuse-to-release-from-anywhere-but-main.sh

      - name: Verify every manifest agrees with VERSION
        run: python3 scripts/validate_versions.py

      - name: Resolve the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-prepare/resolve-version.sh

      - name: Require main to be green
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/release-prepare/require-main-to-be-green.sh

      - name: Bump the version everywhere
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-prepare/bump-version.sh

      - name: Generate the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-prepare/generate-release-notes.sh

      - name: Push the bump to main
        id: push
        env:
          # zizmor: ignore[secrets-outside-env] -- the token is in env, which is
          # the point; the URL below is assembled inside the shell so it never
          # appears in a workflow expression.
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.LATEST_CHANGES }}
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/release-prepare/push-the-bump-to-main.sh

      - name: Open the release draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.LATEST_CHANGES }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.push.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-prepare/open-release-draft.sh

      - name: Summarise
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
          OUTCOME: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/release-prepare/summarise.sh
