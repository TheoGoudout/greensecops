name: Deploy to Production
true:
  release:
    types:
    - published
permissions: {}
jobs:
  deploy:
    environment: production
    if: github.repository_owner != 'fastapi'
    runs-on:
    - self-hosted
    - production
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
    - name: GreenSecOps Telemetry
      uses: greensecops/greensecops-action@v1
      with:
        greensecops_url: ${{ vars.GREENSECOPS_URL }}
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
    - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION
        }} build
    - run: docker compose -f compose.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION
        }} up -d
