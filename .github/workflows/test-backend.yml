name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# One run per pull request, and per branch for a push.
#
# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. *Not* cancelled for a push to
# main: that run is the branch's own record, and a second merge landing while
# it is still going would erase the first one's result rather than supersede
# it — the check would simply be missing from the commit that caused it. Here
# that is load-bearing twice over: the run uploads the `coverage-html` artifact
# that smokeshow.yml consumes through `workflow_run`, and a cancelled run
# publishes no artifact, so the coverage status never lands on the commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    # Twenty, not five. Five is what a pure-Python check gets elsewhere in this
    # repository, and it was inherited here for a job that also pulls two
    # compose services, waits for Postgres, runs the migrations and then the
    # whole suite — a cold cache alone can spend most of it. A timeout tuned
    # below the work it bounds does not catch a hang, it manufactures one.
    timeout-minutes: 20
    permissions:
      contents: read # To check out the repository below.
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_URL_BACKEND: http://localhost:8000
      SERVICE_URL_FRONTEND: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: .github/scripts/test-backend/prepare-env-files.sh
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The application floor, from backend/pyproject.toml's
          # `requires-python = ">=3.10"`. The suite runs against the oldest
          # interpreter the package claims to support, which is the only version
          # of that claim anything actually checks. Tooling-only jobs
          # (deploy-checks, opa, pre-commit, smokeshow) are on 3.11 instead —
          # ansible-core >= 2.19 requires a 3.11+ controller.
          python-version: "3.10"
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.4"
      # --wait, so the migrations below never race Postgres starting up.
      - name: Start Postgres and MailCatcher
        run: docker compose up -d --wait db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          SHA: ${{ github.sha }}
        run: uv run bash scripts/tests-start.sh "Coverage for ${SHA}"
        working-directory: backend
      - name: Stop the containers
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
