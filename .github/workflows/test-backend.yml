name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: ${{ secrets.SERVICE_PASSWORD_POSTGRES }}
      SERVICE_PASSWORD_64_SECRETKEY: ${{ secrets.SERVICE_PASSWORD_64_SECRETKEY }}
      SERVICE_PASSWORD_FIRSTSUPERUSER: ${{ secrets.SERVICE_PASSWORD_FIRSTSUPERUSER }}
      SERVICE_URL_BACKEND: ${{ vars.SERVICE_URL_BACKEND }}
      SERVICE_URL_FRONTEND: ${{ vars.SERVICE_URL_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare env files
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env
          # Align Coolify-generated secrets with their .env counterparts so the
          # backend process (running outside Docker) sees consistent credentials.
          printf '\nFIRST_SUPERUSER_PASSWORD=%s\n' "$SERVICE_PASSWORD_FIRSTSUPERUSER" >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$SERVICE_PASSWORD_POSTGRES" >> .env
          printf 'POSTGRES_USER=%s\n' "$SERVICE_USER_POSTGRES" >> .env
          printf 'SECRET_KEY=%s\n' "$SERVICE_PASSWORD_64_SECRETKEY" >> .env
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.4"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
