name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Coolify magic variables — supplied with test values since they are
      # auto-generated by Coolify at deploy time but empty in CI.
      SERVICE_USER_POSTGRES: postgres
      SERVICE_PASSWORD_POSTGRES: testpassword
      SERVICE_PASSWORD_64_SECRETKEY: changethischangethischangethischangethischangethischangethischanget
      SERVICE_PASSWORD_FIRSTSUPERUSER: testpassword
      SERVICE_URL_BACKEND: http://localhost:8000
      SERVICE_URL_FRONTEND: http://localhost:5173
    permissions:
      id-token: write
    steps:
      - name: GreenSecOps Telemetry
        uses: green-sec-ops/telemetry@v1
        with:
          greensecops_url: ${{ vars.GREENSECOPS_URL || 'https://api.greensecops.goudout.com' }}
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare env files
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env
          # Align Coolify-generated secrets with their .env counterparts so the
          # backend process (running outside Docker) sees consistent credentials.
          printf '\nFIRST_SUPERUSER_PASSWORD=%s\n' "$SERVICE_PASSWORD_FIRSTSUPERUSER" >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$SERVICE_PASSWORD_POSTGRES" >> .env
          printf 'POSTGRES_USER=%s\n' "$SERVICE_USER_POSTGRES" >> .env
          printf 'SECRET_KEY=%s\n' "$SERVICE_PASSWORD_64_SECRETKEY" >> .env
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.4"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
