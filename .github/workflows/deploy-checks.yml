name: deploy-checks

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "compose.yml"
      - "landing/entrypoint.sh"
      - "scripts/validate_coolify_compose.py"
      - "scripts/validate_landing_defaults.py"
      - ".github/workflows/deploy-checks.yml"
      - ".github/scripts/**"
      # The version-drift job below. Without these the job would be
      # unreachable on exactly the commits it exists to police — none of the
      # paths above match a manifest bump.
      - "VERSION"
      - "*/package.json"
      - "*/pyproject.toml"
      - "package.json"
      - "pyproject.toml"
      - "backend/app/__version__.py"
      - "frontend/src/client/core/OpenAPI.ts"
      - "scripts/_versions.py"
      - "scripts/validate_versions.py"
      - "scripts/bump_version.py"
  pull_request:
    paths:
      - "deploy/**"
      - "compose.yml"
      - "landing/entrypoint.sh"
      - "scripts/validate_coolify_compose.py"
      - "scripts/validate_landing_defaults.py"
      - ".github/workflows/deploy-checks.yml"
      - ".github/scripts/**"
      # The version-drift job below. Without these the job would be
      # unreachable on exactly the commits it exists to police — none of the
      # paths above match a manifest bump.
      - "VERSION"
      - "*/package.json"
      - "*/pyproject.toml"
      - "package.json"
      - "pyproject.toml"
      - "backend/app/__version__.py"
      - "frontend/src/client/core/OpenAPI.ts"
      - "scripts/_versions.py"
      - "scripts/validate_versions.py"
      - "scripts/bump_version.py"

permissions: {}

# One run per pull request, and per branch for a push.
#
# Cancelled for a pull request, because a superseded commit's checks are an
# answer about code nobody is going to merge. *Not* cancelled for a push to
# main: that run is the branch's own record, and a second merge landing while
# it is still going would erase the first one's result rather than supersede
# it — the check would simply be missing from the commit that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so local hooks, CI and the documented runbook agree. 1.10 is the
  # floor for S3 native state locking, which deploy/terraform/backend.tf uses.
  TERRAFORM_VERSION: "1.14.4"
  # The same range deploy-reusable.yml pins, spelled the same way, because the
  # two have to agree: this job is what asserts the playbooks are clean under
  # the ansible-core that actually deploys them. It was a literal in the
  # `pip install` line here and an env var there — one range, two places to
  # edit, and nothing that noticed when only one moved.
  #
  # >= 2.19 is also why every Python here is 3.11 rather than the 3.10 the
  # application is tested on: 2.19 requires a 3.11+ controller.
  ANSIBLE_CORE_VERSION: ">=2.19,<2.21"
  ANSIBLE_LINT_VERSION: ">=25.9,<26.0"

jobs:
  terraform:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: .github/scripts/deploy-checks/install-terraform.sh

      - name: Check formatting
        run: terraform fmt -check -recursive -diff deploy/terraform

      - name: Validate the main root
        env:
          TF_IN_AUTOMATION: "1"
        run: .github/scripts/deploy-checks/validate-root.sh deploy/terraform

      - name: Validate the bootstrap root
        env:
          TF_IN_AUTOMATION: "1"
        run: .github/scripts/deploy-checks/validate-root.sh deploy/terraform/bootstrap

  coolify:
    name: Coolify compose drift
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "PyYAML>=6,<7"

      - name: Check the Coolify compose against compose.yml
        run: python scripts/validate_coolify_compose.py

  cloudflare:
    name: Landing default drift
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # No dependencies: the script reads a KEY=value file and a shell script
      # with the standard library, so there is nothing to install.
      - name: Check the landing defaults against production.env
        run: python scripts/validate_landing_defaults.py

  versions:
    name: Version drift
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # No dependencies: the script reads manifests with the standard library.
      - name: Check every manifest against VERSION
        run: python scripts/validate_versions.py

  ansible:
    name: Ansible lint & syntax check
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository below.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install "ansible-core${ANSIBLE_CORE_VERSION}" "ansible-lint${ANSIBLE_LINT_VERSION}"

      - name: Install collections
        # amazon.aws supplies both the aws_ec2 inventory plugin and the aws_ssm
        # connection plugin; without it the playbooks cannot even be parsed.
        working-directory: deploy/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Lint
        working-directory: deploy/ansible
        run: ansible-lint .

      - name: Syntax check
        working-directory: deploy/ansible
        # `-i localhost,` rather than the real inventory: parsing the playbooks
        # does not need hosts, and the dynamic inventory would call AWS.
        run: ansible-playbook -i localhost, --syntax-check playbooks/site.yml
