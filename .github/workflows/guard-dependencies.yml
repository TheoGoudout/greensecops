name: Guard Dependencies

on:
  # zizmor: ignore[dangerous-triggers] -- the checkout below is pinned to the
  # base branch, so the only code this job runs is code already on main. PR
  # code is never fetched, never built and never executed; the job reads
  # context.payload metadata and nothing from the head ref.
  pull_request_target:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock

permissions: {}

# Keyed on the pull request, and cancelled: a force-push while the check is
# still running makes the earlier run's verdict about code that is no longer
# there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-author:
    name: Check PR Author
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # To check out the base branch below.
      issues: write # To comment on the pull request before closing it.
      pull-requests: write # To close a pull request from a non-member.
    steps:
      # Base branch only — see the note on the trigger. Needed because the
      # check below is a file in this repository rather than a script inlined
      # here, and github-script can only require what is on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check if author is org member or allowed bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/guard-dependencies/check-author.cjs`)({github, context, core})
