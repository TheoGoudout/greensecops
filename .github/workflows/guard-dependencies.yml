name: Guard Dependencies
true:
  pull_request_target:
    branches:
    - master
    paths:
    - pyproject.toml
    - uv.lock
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
    - name: GreenSecOps Telemetry
      uses: greensecops/greensecops-action@v1
      with:
        greensecops_url: ${{ vars.GREENSECOPS_URL }}
    - name: Check if author is org member or allowed bot
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const pr = context.payload.pull_request;\nconst author = pr.user.login;\n\
          const assoc = pr.author_association;\n\nconst botAllowlist = new Set(['dependabot[bot]']);\n\
          const orgAuthorAssociations = new Set(['MEMBER', 'OWNER']);\n\nconst allowed\
          \ =\n  botAllowlist.has(author) ||\n  (assoc != null && orgAuthorAssociations.has(assoc));\n\
          \nif (!allowed) {\n  await github.rest.issues.createComment({\n    owner:\
          \ context.repo.owner,\n    repo: context.repo.repo,\n    issue_number: context.payload.pull_request.number,\n\
          \    body: `This PR modifies dependency files (\\`pyproject.toml\\` or \\\
          `uv.lock\\`), which is restricted to members of the **${context.repo.owner}**\
          \ organization on GitHub.\\n\\nIf you need a dependency change, please [open\
          \ a discussion](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions/new)\
          \ describing what you need and why.\\n\\nClosing this PR automatically.`\n\
          \  });\n\n  await github.rest.pulls.update({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    pull_number: context.payload.pull_request.number,\n\
          \    state: 'closed'\n  });\n\n  core.setFailed('Dependency changes are\
          \ restricted to organization members.');\n} else {\n  console.log(`Author\
          \ ${author} (author_association=${assoc}) is allowed to make dependency\
          \ changes.`);\n}\n"
