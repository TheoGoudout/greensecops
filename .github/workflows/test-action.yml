name: Test Action

on:
  push:
    branches:
      - main
    paths:
      - "action/**"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "action/**"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948de14949fe11 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint & format check
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test:coverage
