version: 2

# Playwright is one dependency that Dependabot sees as two. The npm package
# `@playwright/test` is pinned to an exact version in frontend/package.json and
# landing/package.json, and the browser image it drives —
# `mcr.microsoft.com/playwright:v<x.y.z>-noble` in frontend/Dockerfile.playwright
# — ships exactly the browser builds that release expects. Bump one without the
# other and the runner aborts before the first test ("Executable doesn't exist
# at /ms-playwright/..."), which is why the split produced two pull requests
# that were both red on their own and only green if merged together.
#
# A multi-ecosystem group makes Dependabot open a single pull request carrying
# both the bun and docker halves, so CI tests the pair it will actually ship.
multi-ecosystem-groups:
  frontend-stack:
    schedule:
      interval: weekly
    # `commit-message`, `target-branch`, `milestone` and
    # `pull-request-branch-name` are group-only: setting them on a member
    # `updates` entry is a config error, so they live here. `labels` is the
    # exception — group and ecosystem labels are merged.
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directories:
      - /
      - /action
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
  # Python uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python-packages:
        patterns:
          - "*"
  # bun — the whole workspace (frontend, landing, action) shares bun.lock at the
  # repo root, so `@playwright/test` is bumped here and the image it has to match
  # is bumped by the /frontend docker entry below. Both are in `frontend-stack`
  # so those two bumps land in one pull request.
  #
  # `patterns: ["*"]` (required alongside `multi-ecosystem-group`) sends every
  # bun dependency into that pull request, not just Playwright: Dependabot allows
  # only one `updates` entry per package-ecosystem + directory pair, so there is
  # no second bun entry left to carry the rest. This replaces the old
  # `groups: npm-packages` single-ecosystem group, which bundled the same
  # dependencies into a pull request of their own.
  - package-ecosystem: bun
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: frontend-stack
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
      # typescript 7 (native compiler) breaks @vercel/ncc's ts-loader and
      # @hey-api/openapi-ts; keep it on the 6.x line (see action/package.json
      # and the root "overrides" pin).
      - dependency-name: "typescript"
        versions:
          - ">=7"
  # Docker, everywhere except /frontend.
  #
  # python is deliberately unpinned here. The old `>=3.15.0-0` ignore existed to
  # keep release candidates out (a bare `>=3.15` does not: prereleases sort
  # *below* the release they lead to, so 3.15.0rc1 slipped past it once, and
  # psycopg-binary shipped no cp315 wheels). It also blocked 3.15.0 final and
  # every stable release after it, which is not what we want. Dependabot's docker
  # updater now filters prereleases itself, twice over: tags matching rc/alpha/
  # beta/dev/preview/`3.15.0a2`-style patterns are dropped, and so is any tag
  # numerically above whatever `latest` resolves to — and `python:latest` only
  # ever points at a stable release. So this tracks the newest stable Python and
  # stops at it.
  - package-ecosystem: docker
    directories:
      - /backend
      - /landing
      - /opa
      - /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker:
        patterns:
          - "*"
  # Docker, /frontend only — split out because frontend/Dockerfile.playwright
  # has to move with `@playwright/test` above, and a directory cannot appear in
  # two entries of the same ecosystem. The other images in this directory
  # (oven/bun, nginx-unprivileged) therefore ride along in the group pull
  # request. nginx-unprivileged is also used by /landing and /docs, so it can be
  # bumped by both this entry and the one above — to the same version, in two
  # pull requests touching different Dockerfiles.
  - package-ecosystem: docker
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: frontend-stack
    cooldown:
      default-days: 7
  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker-compose:
        patterns:
          - "*"
  # Go modules
  - package-ecosystem: gomod
    directory: /action/native/proc-sampler
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      go-packages:
        patterns:
          - "*"
  # pre-commit
  - package-ecosystem: "pre-commit"
    directories:
      - "/"
      - "/backend"
      - "/docs"
      - "/frontend"
      - "/action"
      - "/landing"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "pre-commit"
    groups:
      pre-commit:
        patterns:
          - "*"
  # Terraform providers and modules for the AWS deployment
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/terraform"
      - "/deploy/terraform/bootstrap"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "terraform"
    groups:
      terraform:
        patterns:
          - "*"
