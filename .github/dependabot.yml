version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directories:
      - /
      - /action
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns:
          - "*"
  # Python uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python-packages:
        patterns:
          - "*"
  # bun
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
      # typescript 7 (native compiler) breaks @vercel/ncc's ts-loader and
      # @hey-api/openapi-ts; keep it on the 6.x line (see action/package.json
      # and the root "overrides" pin).
      - dependency-name: "typescript"
        versions:
          - ">=7"
    groups:
      npm-packages:
        patterns:
          - "*"
  # Docker
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /landing
      - /opa
      - /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.15"
    groups:
      docker:
        patterns:
          - "*"
  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    groups:
      docker-compose:
        patterns:
          - "*"
  # Go modules
  - package-ecosystem: gomod
    directory: /action/native/proc-sampler
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      go-packages:
        patterns:
          - "*"
  # pre-commit
  - package-ecosystem: "pre-commit"
    directories:
      - "/"
      - "/backend"
      - "/docs"
      - "/frontend"
      - "/action"
      - "/landing"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "pre-commit"
    groups:
      pre-commit:
        patterns:
          - "*"
  # Terraform providers and modules for the AWS deployment
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/terraform"
      - "/deploy/terraform/bootstrap"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - "internal"
      - "dependencies"
      - "terraform"
    groups:
      terraform:
        patterns:
          - "*"
