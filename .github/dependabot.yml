version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directories:
      - /
      - /action
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    # Only labels that already exist in the repository. A name listed here that
    # has no label behind it is skipped and draws a "could not be found" comment
    # on every pull request the entry opens — which is what `github_actions` was
    # doing on #254, and `pre-commit` and `terraform` on the two entries below.
    # Rather than mint three ecosystem labels nothing reads (the ecosystem is in
    # the title and the diff), every entry now carries the same two that are
    # load-bearing: `dependencies`, and the `internal` that the check-labels
    # gate requires exactly one of. See .github/labeler.yml.
    labels: [dependencies, internal]
    groups:
      github-actions:
        patterns:
          - "*"
  # Python uv — packages only. This never touches the interpreter version; that
  # lives in the two Dockerfiles and is handled by the `python` group below.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python-packages:
        patterns:
          - "*"
  # bun — one entry serves the whole workspace (frontend, landing, action):
  # they share bun.lock at the repo root, and Dependabot allows only one entry
  # per package-ecosystem + directory pair.
  #
  # `@playwright/test` rides in this group like everything else. It has to stay
  # in lockstep with the browser image in frontend/Dockerfile.playwright, which
  # the docker entry bumps in a separate pull request — see the
  # playwright-version-drift pre-commit hook, which fails the moment the two
  # disagree. Routing the pair into one cross-ecosystem pull request was tried
  # in #221 and reverted: a `multi-ecosystem-group` silently disables the
  # `groups` block on the same entry, so every dependency here came out as its
  # own pull request (#226-#231).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
      # typescript 7 (native compiler) breaks @vercel/ncc's ts-loader and
      # @hey-api/openapi-ts; keep it on the 6.x line (see action/package.json
      # and the root "overrides" pin).
      - dependency-name: "typescript"
        versions:
          - ">=7"
    groups:
      npm-packages:
        patterns:
          - "*"
  # Docker — one entry over every directory, split into groups rather than into
  # entries, because a directory can appear only once per ecosystem.
  #
  # `python` gets its own group so the interpreter bump is never bundled with
  # nginx/opa/bun. It spans /backend (python:3.14.6-slim) and /docs
  # (python:3.14-slim) and, because a group over `directories` produces a single
  # pull request, both Dockerfiles move in one PR (cf. e7b8b0b, "Bump the docker
  # group across 4 directories").
  #
  # python carries no `ignore` any more. The old `>=3.15.0-0` rule kept release
  # candidates out — a bare ">=3.15" does not, since prereleases sort *below*
  # the release they lead to, which is how 3.15.0rc1 slipped past once when
  # psycopg-binary had no cp315 wheels — but it also blocked 3.15.0 final and
  # every stable release after it. Dependabot's docker updater now drops
  # prereleases by itself, twice over: tags matching rc/alpha/beta/dev/preview
  # or `3.15.0a2` forms are rejected, and so is anything numerically above what
  # `latest` resolves to, and `python:latest` only ever points at a stable
  # release.
  #
  # A longer hold for feature releases specifically is not expressible here:
  # Dependabot rejects `semver-major-days`/`semver-minor-days` for the docker
  # ecosystem ("not supported for the package ecosystem 'docker'"), and
  # `default-days` is a single value for the whole entry — raising it would
  # also delay nginx and opa patches. So 3.15.0 can land a week after release;
  # if psycopg-binary is again short of wheels, pin it in the PR rather than
  # blocking the whole line here.
  - package-ecosystem: docker
    directories:
      - /backend
      - /docs
      - /frontend
      - /landing
      - /opa
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      python:
        patterns:
          - "python"
      docker:
        patterns:
          - "*"
        exclude-patterns:
          - "python"
  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      docker-compose:
        patterns:
          - "*"
  # Go modules
  - package-ecosystem: gomod
    directory: /action/native/proc-sampler
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      go-packages:
        patterns:
          - "*"
  # pre-commit
  - package-ecosystem: "pre-commit"
    directories:
      - "/"
      - "/backend"
      - "/docs"
      - "/frontend"
      - "/action"
      - "/landing"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      pre-commit:
        patterns:
          - "*"
  # Terraform providers and modules for the AWS deployment
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/terraform"
      - "/deploy/terraform/bootstrap"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels: [dependencies, internal]
    groups:
      terraform:
        patterns:
          - "*"
