# Reference "state of the art" deployment workflow.
#
# This file is the single source of truth for the compliant workflow shown on
# the marketing landing page and in the documentation. It is validated in CI
# (scripts/validate_examples.py) to produce ZERO GreenSecOps violations across
# every rule, so it can never silently drift as new rules are added.
name: Deploy to Production

on:
  push:
    branches: [main]
    # Only run for changes that can affect the deployment. The workflow file
    # itself is listed so a change to it still triggers a run.
    paths:
      - "src/**"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

# Least privilege by default: the workflow grants nothing, and each job opts
# into exactly the scopes it needs.
permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Keep the token out of .git/config, where every later step in the
          # job — including anything a dependency runs — could read it.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install & build
        run: npm ci && npm run build
      - name: Deploy
        run: ./deploy.sh
        env:
          API_KEY: ${{ secrets.API_KEY }}
