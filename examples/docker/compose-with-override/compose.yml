# Base configuration. On its own this file looks careless — `api` declares no
# restart policy, no resource limits, no log bound and no security options —
# but Compose never runs this file on its own. The override beside it supplies
# all four, and grading the merged configuration is the only way to see that.
services:
  api:
    image: ghcr.io/example/api:1.4.2@sha256:3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b

  worker:
    image: ghcr.io/example/worker:1.4.2@sha256:5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
