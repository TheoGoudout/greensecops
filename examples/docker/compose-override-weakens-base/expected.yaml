# Each of the four override-weakening rules fires exactly once, on the field it
# names. These are only expressible because the scan sees both the files as
# they sit on disk and their merge — reading the override alone cannot tell
# that anything was undone, and reading the merge alone cannot tell where.
#
# compose_service_not_hardened also fires: `api` ends up writable in the merged
# configuration, which is the same weakening seen from the other side. The two
# are not redundant — one says the setting was removed, the other says the
# running configuration lacks it, and a target with only the second has no
# override at all.
violations:
  - compose_override_weakens_user
  - compose_override_disables_read_only
  - compose_override_adds_capabilities
  - compose_override_exposes_bound_port
  - compose_service_not_hardened
