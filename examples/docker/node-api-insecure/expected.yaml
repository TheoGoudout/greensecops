# A Node service built the way a first Dockerfile usually looks. Nothing here
# is exotic -- a single stage, the source copied before the install, a registry
# token copied in, TLS verification switched off for a proxy -- and between the
# Dockerfile and its Compose file it trips most of the container_docker suite.
violations:
  - apt_cache_not_cleaned
  - apt_recommends_not_disabled
  - apt_update_in_separate_layer
  - chmod_world_writable
  - compose_dependency_without_healthcheck
  - compose_depends_on_without_condition
  - compose_hardcoded_secret
  - compose_service_not_hardened
  - compose_service_unbounded
  - compose_missing_restart_policy
  - compose_port_bound_to_all_interfaces
  - compose_unpinned_image_tag
  - container_runs_as_root
  - copy_before_dependency_install
  - heavy_base_image
  - insecure_tls_download
  - missing_healthcheck
  - missing_oci_labels
  - missing_workdir
  - secret_file_copied
  - shell_form_entrypoint
  - unpinned_base_image
