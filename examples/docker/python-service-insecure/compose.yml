version: "3.8"

services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DB_PASSWORD: hunter2
    depends_on:
      - db

  db:
    image: postgres
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - SYS_ADMIN
