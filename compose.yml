services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}

  redis:
    image: redis:8-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-redis-data:/data

  backend:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: &backend-required-env
      # General
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PROJECT_NAME=${PROJECT_NAME:-GreenSecOps}
      # Hosts & URLs
      - FRONTEND_HOST=${SERVICE_URL_FRONTEND}
      - BACKEND_HOST=${SERVICE_URL_BACKEND}
      - GREENSECOPS_PUBLIC_URL=${GREENSECOPS_PUBLIC_URL}
      - MARKETING_URL=${SERVICE_URL_LANDING}
      - DOCS_URL=${SERVICE_URL_DOCS}
      - BACKEND_CORS_ORIGINS=${SERVICE_URL_FRONTEND}
      # Auth & Security
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_FIRSTSUPERUSER}
      - EMAIL_RESET_TOKEN_EXPIRE_HOURS=${EMAIL_RESET_TOKEN_EXPIRE_HOURS:-48}
      # Database & Infrastructure
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_URL=redis://redis:6379/0
      - OPA_URL=http://opa:8181
      # Email / SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@example.com}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME}
      - SMTP_TLS=${SMTP_TLS:-True}
      - SMTP_SSL=${SMTP_SSL:-False}
      - SMTP_PORT=${SMTP_PORT:-587}
      # GitHub
      - GITHUB_ACTION_REF=${GITHUB_ACTION_REF:-greensecops/telemetry@v1}
      - GITHUB_BOT_HANDLE=${GITHUB_BOT_HANDLE:-@greensecops}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${SERVICE_HEX_40_GITHUBWEBHOOKSECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_BOT_TOKEN=${GITHUB_BOT_TOKEN}
      - GITHUB_BOT_LOGIN=${GITHUB_BOT_LOGIN}
      # AI / LLM
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - AI_PROVIDERS_CONFIG=${AI_PROVIDERS_CONFIG}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-greensecops}
      # Billing (Stripe)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_ULTIMATE=${STRIPE_PRICE_ULTIMATE}
      # Observability
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  prestart:
    image: greensecops/backend:${TAG:-latest}
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: *backend-required-env

  celery-worker:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,analysis,fixes
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  celery-beat:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule /tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  opa:
    image: greensecops/opa:${TAG:-latest}
    build:
      context: .
      dockerfile: opa/Dockerfile
    restart: always
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://localhost:8181/health\"}).status_code == 200; true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies

  frontend:
    image: greensecops/frontend:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${SERVICE_URL_BACKEND}
        - VITE_GITHUB_APP_NAME=${GITHUB_APP_NAME}
        - VITE_GITHUB_OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}

  landing:
    image: greensecops/landing:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: landing/Dockerfile
    environment:
      - APP_URL=${SERVICE_URL_FRONTEND}
      - MARKETING_URL=${SERVICE_URL_LANDING}
      - DOCS_URL=${SERVICE_URL_DOCS}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - SALES_EMAIL=${SALES_EMAIL}
      - LEGAL_EMAIL=${LEGAL_EMAIL}
      - PRIVACY_EMAIL=${PRIVACY_EMAIL}

  docs:
    image: greensecops/docs:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        - DOCS_BASE_URL=${SERVICE_URL_DOCS}

volumes:
  app-db-data:
  app-redis-data:
