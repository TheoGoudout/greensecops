services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}

  redis:
    image: redis:8-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-redis-data:/data

  backend:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: &backend-required-env
      - FRONTEND_HOST=${FRONTEND_HOST:-https://${SERVICE_FQDN_FRONTEND}}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PROJECT_NAME=${PROJECT_NAME:-GreenSecOps}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-https://${SERVICE_FQDN_FRONTEND}}
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_FIRSTSUPERUSER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@example.com}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - AI_PROVIDERS_CONFIG=${AI_PROVIDERS_CONFIG}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-greensecops}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_ULTIMATE=${STRIPE_PRICE_ULTIMATE}
      - OPA_URL=http://opa:8181
      - DOCS_URL=${DOCS_URL:-https://${SERVICE_FQDN_DOCS}}
      - GITHUB_BOT_HANDLE=${GITHUB_BOT_HANDLE:-@greensecops}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  prestart:
    image: greensecops/backend:${TAG:-latest}
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: *backend-required-env

  celery-worker:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,analysis,fixes
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  celery-beat:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  flower:
    image: mher/flower:2.0.1
    restart: always
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555

  opa:
    image: openpolicyagent/opa:${TAG:-latest}
    build:
      context: .
      dockerfile: opa/Dockerfile
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies
    volumes:
      - ./backend/app/rules:/policies:ro

  frontend:
    image: greensecops/frontend:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://${SERVICE_FQDN_BACKEND}
        - VITE_GITHUB_OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}
        - VITE_GITHUB_APP_NAME=${GITHUB_APP_NAME}
        - NODE_ENV=production

  landing:
    image: greensecops/landing:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: landing/Dockerfile
    environment:
      - APP_URL=https://${SERVICE_FQDN_FRONTEND}
      - DOCS_URL=https://${SERVICE_FQDN_DOCS}

  docs:
    image: greensecops/docs:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        - DOCS_BASE_URL=${DOCS_URL:-https://${SERVICE_FQDN_DOCS}}

volumes:
  app-db-data:
  app-redis-data:
