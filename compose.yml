# Resource limits
#
# Every service is bounded, because nothing here bounds itself. A Celery worker
# chewing through a large repository, or a scan that fans out further than
# expected, will otherwise take as much memory as the host has — and when the
# kernel's OOM killer steps in it chooses by score, not by importance. Left
# unbounded, the container it kills is usually PostgreSQL, mid-write.
#
# The pattern is the same for every service:
#
#   mem_limit         hard cap. The container dies alone instead of taking the
#                     host with it. Sized well above steady state, so hitting
#                     it means something is genuinely wrong.
#   mem_reservation   soft floor, used under memory pressure and the honest
#                     number for capacity planning.
#   cpu_shares        relative weight, and only consulted when the CPU is
#                     actually contended. Deliberately not `cpus:`, which is a
#                     hard ceiling: a scan should be free to use the whole box
#                     when the box is idle, and yield when it is not. The
#                     ordering is data tier (2048) > request path (1024) >
#                     background work (512) > static files (256).
#
# The limits sum to more than any host this runs on. That is intended — they
# are caps, not allocations, and only one service should ever approach its own.
# The reservations are what has to fit: about 2.2 GB steady state, which is why
# a 4 GB box works and an 8 GB box leaves room for something else.
#
# If you co-locate other projects on this host, these limits are what stops
# GreenSecOps from being the noisy neighbour. See deploy/coolify/README.md.

services:

  db:
    image: postgres:18
    restart: always
    # PostgreSQL sizes shared_buffers from its own defaults, not from the
    # cgroup, so the cap is what actually bounds it.
    mem_limit: 1g
    mem_reservation: 256m
    cpu_shares: 2048
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}

  redis:
    image: redis:8-alpine
    restart: always
    # Broker as well as cache, so the working set grows with queue depth.
    # Task messages are small — 512m is tens of thousands of queued tasks — but
    # if a backlog ever gets near it, set `maxmemory` rather than raising this:
    # a broker that evicts is better than a broker the kernel kills.
    mem_limit: 512m
    mem_reservation: 64m
    cpu_shares: 2048
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-redis-data:/data

  backend:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    # The image runs `fastapi run --workers 4`, and each uvicorn worker loads
    # the whole application — SQLModel, boto3 and the LLM SDKs — so the floor
    # is four copies of it, not one.
    mem_limit: 1536m
    mem_reservation: 512m
    cpu_shares: 1024
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment: &backend-required-env
      # General
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PROJECT_NAME=${PROJECT_NAME:-GreenSecOps}
      # Hosts & URLs
      - FRONTEND_HOST=${SERVICE_URL_FRONTEND}
      - BACKEND_HOST=${SERVICE_URL_BACKEND}
      - GREENSECOPS_PUBLIC_URL=${GREENSECOPS_PUBLIC_URL}
      - MARKETING_URL=${SERVICE_URL_LANDING}
      - DOCS_URL=${SERVICE_URL_DOCS}
      - BACKEND_CORS_ORIGINS=${SERVICE_URL_FRONTEND}
      # Auth & Security
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_FIRSTSUPERUSER}
      - EMAIL_RESET_TOKEN_EXPIRE_HOURS=${EMAIL_RESET_TOKEN_EXPIRE_HOURS:-48}
      # Database & Infrastructure
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-greensecops}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_URL=redis://redis:6379/0
      - OPA_URL=http://opa:8181
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - S3_BUCKET=${S3_BUCKET:-greensecops-artifacts}
      - S3_REGION=${S3_REGION:-us-east-1}
      # AWS (cloud posture scanning) — GreenSecOps's own identity, distinct
      # from S3_* above (which authenticates to MinIO, not AWS). Not a
      # Coolify magic var: unlike SERVICE_USER_MINIO/SERVICE_PASSWORD_MINIO,
      # this is a real external AWS account's credentials, which Coolify has
      # no way to generate — it must be a real IAM user you create yourself.
      # Optional: unset disables cloud-posture scanning only.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Email / SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@example.com}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME}
      - SMTP_TLS=${SMTP_TLS:-True}
      - SMTP_SSL=${SMTP_SSL:-False}
      - SMTP_PORT=${SMTP_PORT:-587}
      # GitHub
      - GITHUB_ACTION_REF=${GITHUB_ACTION_REF:-greensecops/telemetry@v1}
      - GITHUB_BOT_HANDLE=${GITHUB_BOT_HANDLE:-@greensecops}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${SERVICE_HEX_40_GITHUBWEBHOOKSECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_BOT_TOKEN=${GITHUB_BOT_TOKEN}
      - GITHUB_BOT_LOGIN=${GITHUB_BOT_LOGIN}
      # AI / LLM
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - AI_PROVIDERS_CONFIG=${AI_PROVIDERS_CONFIG}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-greensecops}
      # Billing (Stripe)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_ULTIMATE=${STRIPE_PRICE_ULTIMATE}
      # Observability
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  prestart:
    image: greensecops/backend:${TAG:-latest}
    restart: "no"
    # Runs migrations and exits, so it never overlaps steady state.
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 1024
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    environment: *backend-required-env

  celery-worker:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    # The largest limit in the file, and the one that matters most. Prefork
    # means CELERY_CONCURRENCY child processes plus a parent, each holding the
    # whole application, and a scan's working set on top. Raise this in step
    # with CELERY_CONCURRENCY — roughly 500m per worker plus 500m of parent.
    #
    # Lowest CPU weight of the application services: scans are background work
    # and should yield to anything a user is waiting on.
    mem_limit: 3g
    mem_reservation: 768m
    cpu_shares: 512
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,analysis,fixes
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  celery-beat:
    image: greensecops/backend:${TAG:-latest}
    restart: always
    # Only ever enqueues; it does no work itself.
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 256
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule /tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment: *backend-required-env

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: always
    # Absent from deploy/coolify/, which uses Cloudflare R2 instead.
    mem_limit: 1g
    mem_reservation: 256m
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    volumes:
      - app-minio-data:/data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    command: server /data --console-address ":9001"

  opa:
    image: greensecops/opa:${TAG:-latest}
    build:
      context: .
      dockerfile: opa/Dockerfile
    restart: always
    # Holds the compiled rule bundle in memory across evaluations, which is the
    # whole reason it is a server rather than `opa eval` — the bundle is the
    # bulk of the footprint and it does not grow with load.
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://localhost:8181/health\"}).status_code == 200; true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies

  frontend:
    image: greensecops/frontend:${TAG:-latest}
    restart: always
    # nginx serving a built bundle. compose.override.yml raises this for local
    # development, where the service is a Vite dev server instead.
    mem_limit: 128m
    mem_reservation: 32m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${SERVICE_URL_BACKEND}
        - VITE_GREENSECOPS_PUBLIC_URL=${GREENSECOPS_PUBLIC_URL}
        - VITE_GITHUB_APP_NAME=${GITHUB_APP_NAME}
        - VITE_GITHUB_OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}

  landing:
    image: greensecops/landing:${TAG:-latest}
    restart: always
    mem_limit: 128m
    mem_reservation: 32m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: landing/Dockerfile
    environment:
      - APP_URL=${SERVICE_URL_FRONTEND}
      - MARKETING_URL=${SERVICE_URL_LANDING}
      - DOCS_URL=${SERVICE_URL_DOCS}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - SALES_EMAIL=${SALES_EMAIL}
      - LEGAL_EMAIL=${LEGAL_EMAIL}
      - PRIVACY_EMAIL=${PRIVACY_EMAIL}

  docs:
    image: greensecops/docs:${TAG:-latest}
    restart: always
    # Sphinx runs at build time; the container is nginx serving the result.
    mem_limit: 128m
    mem_reservation: 32m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        - DOCS_BASE_URL=${SERVICE_URL_DOCS}

volumes:
  app-db-data:
  app-redis-data:
  app-minio-data:
